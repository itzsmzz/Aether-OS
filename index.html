        const progEl = body.querySelector('#musicProgress');
        const elapsedEl = body.querySelector('#musicElapsed');
        const totalEl = body.querySelector('#musicTotal');
        const playBtn = body.querySelector('#musicPlay');
        function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
        function render(){
          titleEl.textContent = tracks[idx].t;
          artistEl.textContent = tracks[idx].a;
          totalEl.textContent = fmt(tracks[idx].len);
          elapsedEl.textContent = fmt(elapsed);
          progEl.style.width = (elapsed/tracks[idx].len*100)+'%';
          playBtn.textContent = playing ? '⏸' : '▶️';
        }
        function tick(){ elapsed++; if(elapsed >= tracks[idx].len){ next(); return; } render(); }
        function play(){ playing = true; clearInterval(timer); timer = setInterval(tick, 1000); render(); }
        function pause(){ playing = false; clearInterval(timer); render(); }
        function next(){ idx = (idx+1)%tracks.length; elapsed=0; render(); if(playing){ play(); notify('music', 'Now Playing', `${tracks[idx].t} — ${tracks[idx].a}`); } }
        function prev(){ idx = (idx-1+tracks.length)%tracks.length; elapsed=0; render(); if(playing){ play(); notify('music', 'Now Playing', `${tracks[idx].t} — ${tracks[idx].a}`); } }
        playBtn.addEventListener('click', ()=>{
          if(playing){ pause(); }
          else { play(); notify('music', 'Now Playing', `${tracks[idx].t} — ${tracks[idx].a}`); }
        });
        body.querySelector('#musicNext').addEventListener('click', next);
        body.querySelector('#musicPrev').addEventListener('click', prev);
        win._cleanup = ()=>clearInterval(timer);
        render();

        const grid = body.querySelector('#photoGrid');
        const overlay = body.querySelector('#photoOverlay');
        photos.forEach(p=>{
          const tile = document.createElement('div');
          tile.style.cssText = `aspect-ratio:1;border-radius:12px;background:${p.grad};cursor:pointer;position:relative;overflow:hidden;`;
          tile.innerHTML = `<div style="position:absolute;bottom:0;left:0;right:0;padding:6px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.5));">${p.name}</div>`;
          tile.addEventListener('click', ()=>{
            overlay.style.display='flex';
            overlay.innerHTML = `<div style="width:80%;max-width:380px;aspect-ratio:1;border-radius:18px;background:${p.grad};box-shadow:0 30px 60px rgba(0,0,0,.5);"></div>`;
          });
          grid.appendChild(tile);
        });
        overlay.addEventListener('click', ()=>{ overlay.style.display='none'; });
      }
    });
  }

  /* ============================================================
     APP: TASK MANAGER
  ============================================================ */
  function openTaskManagerApp(){
    createWindow({
      appId:'taskmanager', title:'Task Manager', icon:'taskmanager', width:360, height:420,
      onMount:(body, win)=>{
        function render(){
          const rows = [];
          Object.keys(openWindows).forEach(appId=>{
            (openWindows[appId]||[]).forEach(w=>{
              if(w === win) return;
              rows.push({appId, title: w.dataset.appTitle, winRef: w});
            });
          });
          if(!rows.length){
            body.innerHTML = `<div class="app-pad"><div class="fe-empty">No other apps are currently open</div></div>`;
            return;
          }
          body.innerHTML = `<div class="app-pad">
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">${rows.length} window${rows.length>1?'s':''} running</div>
            <div id="tmList" style="display:flex;flex-direction:column;gap:6px;"></div>
          </div>`;
          const list = body.querySelector('#tmList');
          rows.forEach(r=>{
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(var(--tint-rgb),0.03);';
            row.innerHTML = `<span style="color:var(--accent);display:flex;">${iconSvg(r.appId,16,1.7)}</span><span style="flex:1;font-size:12.5px;">${r.title}</span><button style="background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--text-primary);cursor:pointer;">End Task</button>`;
            row.querySelector('button').addEventListener('click', ()=>{
              closeWindow(r.winRef);
              setTimeout(render, 200);
            });
            list.appendChild(row);
          });
        }
        win._cleanup = ()=>{};
        render();
      }
    });
  }

  const APPS = {
    files: ()=>openFilesApp(''),
    notes: ()=>openNotesApp(null, null),
    terminal: openTerminalApp,
    calculator: openCalculatorApp,
    settings: openSettingsApp,
    browser: openBrowserApp,
    music: openMusicApp,
    photos: openPhotosApp,
    taskmanager: openTaskManagerApp,
  };

  /* ============================================================
     LAUNCHER (START MENU)
  ============================================================ */
  const APP_META = [
    {id:'files', name:'Files'},
    {id:'notes', name:'Notes'},
    {id:'terminal', name:'Terminal'},
    {id:'browser', name:'Browser'},
    {id:'music', name:'Music'},
    {id:'photos', name:'Photos'},
    {id:'calculator', name:'Calculator'},
    {id:'taskmanager', name:'Task Manager'},
    {id:'settings', name:'Settings'},
    {id:'lock', name:'Lock Screen'},
    {id:'trash', name:'Trash'},
  ];
  const launcher = document.getElementById('launcher');
  const launcherSearch = document.getElementById('launcherSearch');
  const launcherGrid = document.getElementById('launcherGrid');
  const launcherEmpty = document.getElementById('launcherEmpty');
  let kbdIndex = 0;

  function renderLauncher(filter){
    const q = (filter||'').trim().toLowerCase();
    const items = APP_META.filter(a => a.name.toLowerCase().includes(q));
    launcherGrid.innerHTML = '';
    launcherEmpty.style.display = items.length ? 'none' : 'block';
    kbdIndex = 0;
    items.forEach((a, i)=>{
      const el = document.createElement('div');
      el.className = 'launcher-item'+(i===0?' kbd-sel':'');
      el.dataset.app = a.id;
      el.innerHTML = `<div class="li-icn">${iconSvg(a.id, 26, 1.6)}</div><div class="li-lbl">${a.name}</div>`;
      el.addEventListener('click', ()=>launchFromLauncher(a.id));
      launcherGrid.appendChild(el);
    });
  }
  function launchFromLauncher(appId){
    closeLauncher();
    if(appId==='trash'){ toast('Trash is empty'); return; }
    if(appId==='lock'){ relock(); return; }
    launchApp(appId);
  }
  function openLauncher(){
    launcherSearch.value = '';
    renderLauncher('');
    launcher.classList.add('open');
    setTimeout(()=>launcherSearch.focus(), 60);
  }
  function closeLauncher(){ launcher.classList.remove('open'); }
  function toggleLauncher(){ launcher.classList.contains('open') ? closeLauncher() : openLauncher(); }

  document.getElementById('mbLogo').addEventListener('click', (e)=>{ e.stopPropagation(); toggleLauncher(); });
  document.getElementById('dockStart').addEventListener('click', (e)=>{ e.stopPropagation(); toggleLauncher(); });
  document.getElementById('dockStart').addEventListener('contextmenu', (e)=>{
    e.preventDefault(); e.stopPropagation();
    closeCtx();
    ctxEl = document.createElement('div');
    ctxEl.className = 'ctx';
    ctxEl.style.left = e.clientX+'px';
    ctxEl.style.top = 'auto';
    ctxEl.style.bottom = (window.innerHeight - e.clientY + 14) + 'px';
    ctxEl.innerHTML = `
      <div class="ctx-item" data-a="settings">${iconSvg('settings',15,1.8)} Settings</div>
      <div class="ctx-item" data-a="taskmanager">${iconSvg('taskmanager',15,1.8)} Task Manager</div>
      <div class="ctx-item" data-a="lock">${iconSvg('lock',15,1.8)} Lock Screen</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-a="about">${iconSvg('info',15,1.8)} About Aether</div>
      <div class="ctx-item" data-a="restart">${iconSvg('refresh',15,1.8)} Restart Aether</div>
    `;
    document.body.appendChild(ctxEl);
    ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        const a = it.dataset.a;
        closeCtx();
        if(a==='settings' || a==='about') openSettingsApp();
        if(a==='taskmanager') launchApp('taskmanager');
        if(a==='lock') relock();
        if(a==='restart'){ toast('Restarting Aether…'); setTimeout(()=>location.reload(), 600); }
      });
    });
  });
  launcherSearch.addEventListener('input', ()=>renderLauncher(launcherSearch.value));
  launcher.addEventListener('mousedown', (e)=>{ if(e.target===launcher) closeLauncher(); });
  launcherSearch.addEventListener('keydown', (e)=>{
    const items = Array.from(launcherGrid.querySelectorAll('.launcher-item'));
    if(!items.length) return;
    if(e.key==='ArrowRight' || e.key==='ArrowDown'){
      e.preventDefault();
      items[kbdIndex].classList.remove('kbd-sel');
      kbdIndex = Math.min(items.length-1, kbdIndex+1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){
      e.preventDefault();
      items[kbdIndex].classList.remove('kbd-sel');
      kbdIndex = Math.max(0, kbdIndex-1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      launchFromLauncher(items[kbdIndex].dataset.app);
    }
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeLauncher();
  });

  /* ============================================================
     DESKTOP RIGHT-CLICK CONTEXT MENU
  ============================================================ */
  let ctxEl = null;
  function closeCtx(){ if(ctxEl){ ctxEl.remove(); ctxEl=null; } }
  document.addEventListener('click', closeCtx);
  desktop.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    closeCtx();
    ctxEl = document.createElement('div');
    ctxEl.className='ctx';
    ctxEl.style.left = e.clientX+'px';
    ctxEl.style.top = e.clientY+'px';
    ctxEl.innerHTML = `
      <div class="ctx-item" data-a="new">${iconSvg('plus',15,1.8)} New Text File</div>
      <div class="ctx-item" data-a="files">${iconSvg('files',15,1.8)} Open Files</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-a="settings">${iconSvg('settings',15,1.8)} Settings</div>
      <div class="ctx-item" data-a="about">${iconSvg('info',15,1.8)} About Aether</div>
    `;
    document.body.appendChild(ctxEl);
    ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        const a = it.dataset.a;
        if(a==='new') openNotesApp(null,null);
        if(a==='files') openFilesApp('');
        if(a==='settings') openSettingsApp();
        if(a==='about') openSettingsApp();
      });
    });
  });

  /* ============================================================
     DESKTOP ICON SELECTION
  ============================================================ */
  document.querySelectorAll('.dicon').forEach(ic=>{
    ic.addEventListener('click',(e)=>{
      e.stopPropagation();
      document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel'));
      ic.classList.add('sel');
    });
  });
  desktop.addEventListener('click', ()=>document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel')));

  /* ============================================================
     TRASH — drop a file/folder here to delete it for real
  ============================================================ */
  const trashIcon = document.querySelector('.dicon[data-app="trash"]');
  if(trashIcon){
    trashIcon.addEventListener('dragover', (e)=>{ e.preventDefault(); trashIcon.classList.add('drop-hover'); });
    trashIcon.addEventListener('dragleave', ()=>trashIcon.classList.remove('drop-hover'));
    trashIcon.addEventListener('drop', (e)=>{
      e.preventDefault();
      trashIcon.classList.remove('drop-hover');
      let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      const fromNode = getNode(data.from) || FS.root;
      if(fromNode.children && fromNode.children[data.key]){
        delete fromNode.children[data.key];
        persistFS();
        notify('trash', 'Moved to Trash', `"${data.key}" was deleted.`);
      }
    });
  }

})();
</script>
</body>
</html>
