<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether — a web OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0c11;
    --bg-elevated:#14171f;
    --glass: rgba(255,255,255,0.055);
    --glass-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.12);
    --accent:#e8935b;
    --accent-soft: rgba(232,147,91,0.32);
    --cool:#7fe3d6;
    --text-primary:#f1ede7;
    --text-muted:#9a9ca6;
    --text-dim:#666a76;
    --danger:#e8615b;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Outfit',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:var(--font-body);
    color:var(--text-primary);
    background:var(--bg-void);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.25);}

  /* ============ BOOT ============ */
  #boot{
    position:fixed;inset:0;z-index:9999;
    background:radial-gradient(ellipse at 50% 40%, #1a1d27 0%, #0a0c11 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .7s ease;
  }
  #boot.hide{opacity:0;pointer-events:none;}
  .boot-mark{width:64px;height:64px;margin-bottom:28px;}
  .boot-mark circle{
    fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:170;stroke-dashoffset:170;
    animation:draw 1.6s ease forwards;
  }
  .boot-mark path{
    fill:none;stroke:var(--text-primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:80;stroke-dashoffset:80;
    animation:draw 1.2s ease forwards .5s;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .boot-word{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.35em;color:var(--text-muted);margin-bottom:22px;text-transform:uppercase;}
  .boot-bar{width:180px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
  .boot-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--cool));animation:load 1.8s ease forwards .2s;}
  @keyframes load{to{width:100%;}}

  /* ============ LOCK SCREEN ============ */
  #lock{
    position:fixed;inset:0;z-index:9000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .6s cubic-bezier(.6,0,.3,1), opacity .6s ease;
  }
  #lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .lock-clock{font-family:var(--font-display);font-weight:300;font-size:96px;line-height:1;letter-spacing:-2px;text-shadow:0 4px 40px rgba(0,0,0,.4);}
  .lock-date{font-size:17px;color:var(--text-muted);margin-top:10px;font-weight:500;}
  .lock-hint{position:absolute;bottom:60px;font-size:13px;color:var(--text-dim);letter-spacing:.05em;animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .lock-pass{display:flex;gap:8px;margin-top:24px;cursor:default;}
  .lock-pass input{
    background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);border-radius:12px;
    padding:11px 14px;color:var(--text-primary);font-size:14px;outline:none;width:190px;font-family:var(--font-body);
  }
  .lock-pass input::placeholder{color:var(--text-dim);}
  .lock-pass button{
    background:var(--accent);border:none;border-radius:12px;padding:0 18px;color:#1a1006;font-weight:700;cursor:pointer;font-size:13px;
  }
  .lock-error{color:var(--danger);font-size:12px;margin-top:10px;height:14px;text-align:center;}
  .lock-pass.shake{animation:lockshake .4s ease;}
  @keyframes lockshake{
    10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(5px)}
    30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)}
  }

  /* ============ DESKTOP ============ */
  #desktop{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(232,147,91,0.16), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(127,227,214,0.14), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(120,110,220,0.12), transparent 50%),
      linear-gradient(160deg, #10121a 0%, #0a0c11 60%, #0d0f16 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{background-position:0% 0%, 100% 0%, 50% 100%, 0 0;}
    100%{background-position:10% 15%, 85% 20%, 40% 85%, 0 0;}
  }
  #desktop-icons{
    position:absolute;top:44px;left:18px;display:flex;flex-direction:column;gap:6px;z-index:2;
  }
  .dicon{
    width:82px;padding:10px 4px;border-radius:var(--radius-sm);text-align:center;cursor:default;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .dicon:hover, .dicon.sel{background:rgba(255,255,255,0.08);}
  .dicon .icn{font-size:30px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));}
  .dicon .lbl{font-size:11.5px;color:var(--text-primary);text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.25;}

  /* ============ MENU BAR ============ */
  #menubar{
    position:fixed;top:0;left:0;right:0;height:32px;z-index:500;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    background:rgba(15,17,23,0.55);backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:12.5px;font-weight:500;
  }
  #menubar .left{display:flex;align-items:center;gap:18px;}
  #menubar .mark{width:15px;height:15px;opacity:.9;}
  #menubar .appname{font-weight:600;font-family:var(--font-display);}
  #menubar .right{display:flex;align-items:center;gap:14px;color:var(--text-muted);}
  #menubar .right span{cursor:default;}
  #menubar .right .clock{color:var(--text-primary);font-variant-numeric:tabular-nums;}

  /* ============ DOCK ============ */
  #dock-wrap{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;z-index:600;pointer-events:none;}
  #dock{
    pointer-events:auto;
    display:flex;align-items:flex-end;gap:10px;padding:9px 12px;
    background:rgba(20,23,31,0.5);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .dock-item{
    position:relative;width:48px;height:48px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;
    background:var(--glass);border:1px solid rgba(255,255,255,0.06);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), width .16s ease, height .16s ease, background .16s ease;
    transform-origin:bottom center;
  }
  .dock-item:hover{transform:translateY(-10px) scale(1.18);background:var(--glass-strong);}
  .dock-item .dot{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;}
  .dock-item.running .dot{opacity:1;}
  .dock-sep{width:1px;align-self:stretch;background:rgba(255,255,255,0.1);margin:4px 2px;}

  /* ============ WINDOWS ============ */
  .win{
    position:absolute;min-width:280px;min-height:180px;
    background:rgba(22,25,33,0.72);
    backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    box-shadow:0 30px 70px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    display:flex;flex-direction:column;overflow:hidden;
    animation:winopen .28s cubic-bezier(.2,1,.3,1);
  }
  @keyframes winopen{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:none;}}
  .win.closing{animation:winclose .18s ease forwards;}
  @keyframes winclose{to{opacity:0;transform:scale(.94);}}
  .win.max{border-radius:0;}
  .win.anim-resize{transition:left .32s cubic-bezier(.16,1,.3,1), top .32s cubic-bezier(.16,1,.3,1), width .32s cubic-bezier(.16,1,.3,1), height .32s cubic-bezier(.16,1,.3,1);}
  #snap-preview{
    position:fixed;z-index:5000;pointer-events:none;
    background:rgba(232,147,91,0.16);border:2px solid var(--accent);border-radius:16px;
    opacity:0;transition:opacity .12s ease, left .1s ease, top .1s ease, width .1s ease, height .1s ease;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  #snap-preview.show{opacity:1;}
  .win-title{
    height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);cursor:grab;
  }
  .win-title:active{cursor:grabbing;}
  .traffic{display:flex;gap:8px;margin-right:6px;}
  .tlight{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;position:relative;}
  .tlight.close{background:#e8615b;} .tlight.min{background:#e8b95b;} .tlight.max{background:#7fd88a;}
  .tlight span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(0,0,0,0.5);opacity:0;}
  .win-title:hover .tlight span{opacity:1;}
  .win-titletext{font-size:12.5px;font-weight:600;color:var(--text-muted);font-family:var(--font-display);letter-spacing:.01em;}
  .win-body{flex:1;overflow:auto;position:relative;}
  .resize-handle{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;}

  /* ============ CONTEXT MENU ============ */
  .ctx{
    position:fixed;z-index:8000;min-width:190px;padding:6px;
    background:rgba(26,29,38,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    font-size:13px;
  }
  .ctx-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text-primary);}
  .ctx-item:hover{background:var(--accent-soft);}
  .ctx-sep{height:1px;background:rgba(255,255,255,0.08);margin:5px 4px;}

  /* ============ SHARED APP UI ============ */
  .app-pad{padding:16px;height:100%;overflow:auto;}
  .fe-wrap{display:flex;height:100%;}
  .fe-side{width:150px;flex:0 0 auto;background:rgba(255,255,255,0.02);border-right:1px solid rgba(255,255,255,0.06);padding:12px 8px;}
  .fe-side-item{padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-muted);margin-bottom:2px;}
  .fe-side-item:hover{background:var(--glass);color:var(--text-primary);}
  .fe-side-item.active{background:var(--accent-soft);color:var(--text-primary);}
  .fe-main{flex:1;padding:16px;overflow:auto;}
  .fe-crumb{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-family:var(--font-mono);}
  .fe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;}
  .fe-item{padding:10px 4px;border-radius:10px;text-align:center;cursor:pointer;}
  .fe-item:hover{background:var(--glass);}
  .fe-item .fi{font-size:30px;}
  .fe-item .fl{font-size:11.5px;margin-top:6px;word-break:break-word;color:var(--text-primary);}
  .fe-empty{color:var(--text-dim);font-size:13px;padding:30px;text-align:center;}

  textarea.notes-area{
    width:100%;height:100%;border:none;outline:none;resize:none;
    background:transparent;color:var(--text-primary);font-family:var(--font-mono);font-size:14px;line-height:1.6;padding:18px;
  }
  .notes-tab{padding:8px 14px;font-size:12.5px;color:var(--text-muted);border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);}

  .term{background:#0c0d12;height:100%;padding:12px 14px;font-family:var(--font-mono);font-size:13px;overflow:auto;color:#d6f5ec;}
  .term-line{white-space:pre-wrap;word-break:break-word;margin-bottom:2px;}
  .term-prompt{color:var(--accent);}
  .term-input-row{display:flex;}
  .term-input{flex:1;background:transparent;border:none;outline:none;color:#d6f5ec;font-family:var(--font-mono);font-size:13px;}

  .calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:10px;background:rgba(0,0,0,0.15);}
  .calc-screen{font-family:var(--font-display);font-size:38px;text-align:right;padding:14px 10px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-btn{border:none;border-radius:12px;background:var(--glass);color:var(--text-primary);font-size:17px;font-family:var(--font-display);cursor:pointer;transition:background .12s;}
  .calc-btn:hover{background:var(--glass-strong);}
  .calc-btn.op{background:rgba(232,147,91,0.2);color:var(--accent);}
  .calc-btn.eq{background:var(--accent);color:#1a1006;font-weight:700;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,0.06);}
  .settings-label{font-size:13.5px;}
  .settings-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.active{border-color:var(--text-primary);}
  .toggle{width:42px;height:24px;border-radius:14px;background:rgba(255,255,255,0.15);position:relative;cursor:pointer;flex:0 0 auto;}
  .toggle.on{background:var(--accent);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s ease;}
  .toggle.on .toggle-knob{transform:translateX(18px);}
  .about-mark{width:52px;height:52px;margin-bottom:10px;}

  h3.section-h{font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin:18px 0 4px;}
  h3.section-h:first-child{margin-top:0;}

  /* ============ LAUNCHER ============ */
  #launcher{
    position:fixed;inset:0;z-index:7000;
    background:rgba(8,9,13,0.45);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);
    display:flex;flex-direction:column;align-items:center;
    padding-top:9vh;
    opacity:0;pointer-events:none;transform:scale(1.04);
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,1,.3,1);
  }
  #launcher.open{opacity:1;pointer-events:auto;transform:scale(1);}
  .launcher-search{
    width:min(420px, 80vw);padding:13px 18px;border-radius:16px;
    background:rgba(255,255,255,0.07);border:1px solid var(--glass-border);
    color:var(--text-primary);font-size:15px;font-family:var(--font-body);outline:none;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .launcher-search::placeholder{color:var(--text-dim);}
  .launcher-grid{
    margin-top:44px;display:grid;grid-template-columns:repeat(4,104px);gap:22px 14px;
    max-width:90vw;
  }
  .launcher-item{
    display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;
    padding:10px 6px;border-radius:16px;transition:transform .14s ease, background .14s ease;
  }
  .launcher-item:hover, .launcher-item.kbd-sel{background:rgba(255,255,255,0.07);transform:translateY(-3px);}
  .launcher-item .li-icn{
    width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:var(--glass);border:1px solid rgba(255,255,255,0.08);box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .launcher-item .li-lbl{font-size:12px;color:var(--text-primary);text-align:center;}
  .launcher-empty{margin-top:60px;color:var(--text-dim);font-size:13px;}
  .launcher-hint{position:fixed;bottom:26px;font-size:12px;color:var(--text-dim);letter-spacing:.03em;}

  /* ============ MOBILE CURSOR ============ */
  #mcursor{
    position:fixed;top:0;left:0;width:22px;height:26px;
    pointer-events:none;z-index:99999;opacity:0;
    transform:translate(-100px,-100px);
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.45));
    transition:opacity .15s ease;
  }
  #mcursor.show{opacity:1;}
  #mcursor.tap{transform-origin:top left;}
  #mcursor.tap svg{transform:scale(0.85);transition:transform .1s ease;}
  #mcursor svg{transition:transform .12s ease;}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:rgba(26,29,38,0.9);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
    padding:10px 18px;border-radius:12px;font-size:13px;z-index:9500;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div id="boot">
  <svg class="boot-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27"/><path d="M20 34 L28 42 L45 22"/></svg>
  <div class="boot-word">Aether</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>

<div id="lock">
  <div class="lock-clock" id="lockClock">--:--</div>
  <div class="lock-date" id="lockDate">Loading</div>
  <div class="lock-pass" id="lockPassRow" style="display:none;">
    <input id="lockPassInput" type="password" placeholder="Enter password" autocomplete="off">
    <button id="lockUnlockBtn">Unlock</button>
  </div>
  <div class="lock-error" id="lockError"></div>
  <div class="lock-hint" id="lockHint">click anywhere to unlock</div>
</div>

<div id="desktop">
  <div id="desktop-icons">
    <div class="dicon" data-app="files"><div class="icn">🗂️</div><div class="lbl">Files</div></div>
    <div class="dicon" data-app="notes"><div class="icn">📝</div><div class="lbl">Notes</div></div>
    <div class="dicon" data-app="terminal"><div class="icn">⌨️</div><div class="lbl">Terminal</div></div>
    <div class="dicon" data-app="trash"><div class="icn">🗑️</div><div class="lbl">Trash</div></div>
  </div>
</div>

<div id="menubar">
  <div class="left">
    <svg class="mark" id="mbLogo" viewBox="0 0 64 64" style="cursor:pointer;"><circle cx="32" cy="32" r="27" fill="none" stroke="#e8935b" stroke-width="5"/><path d="M20 34 L28 42 L45 22" fill="none" stroke="#f1ede7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="appname" id="activeAppName">Aether</span>
  </div>
  <div class="right">
    <span id="mb-batt">100%</span>
    <span id="mb-wifi">◉ Aether-5G</span>
    <span class="clock" id="mb-clock">--:--</span>
  </div>
</div>

<div id="dock-wrap">
  <div id="dock">
    <div class="dock-item" data-app="files" title="Files">🗂️<div class="dot"></div></div>
    <div class="dock-item" data-app="notes" title="Notes">📝<div class="dot"></div></div>
    <div class="dock-item" data-app="terminal" title="Terminal">⌨️<div class="dot"></div></div>
    <div class="dock-item" data-app="browser" title="Browser">🧭<div class="dot"></div></div>
    <div class="dock-item" data-app="music" title="Music">🎵<div class="dot"></div></div>
    <div class="dock-item" data-app="photos" title="Photos">🖼️<div class="dot"></div></div>
    <div class="dock-item" data-app="calculator" title="Calculator">🧮<div class="dot"></div></div>
    <div class="dock-sep"></div>
    <div class="dock-item" data-app="settings" title="Settings">⚙️<div class="dot"></div></div>
  </div>
</div>

<div id="launcher">
  <input class="launcher-search" id="launcherSearch" type="text" placeholder="Search apps…" autocomplete="off" spellcheck="false">
  <div class="launcher-grid" id="launcherGrid"></div>
  <div class="launcher-empty" id="launcherEmpty" style="display:none;">No apps match your search</div>
  <div class="launcher-hint">esc to close</div>
</div>

<div id="mcursor">
  <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M1.2 1 L1.2 19.6 L5.9 15.7 L9.1 22.6 L12.3 21.1 L9 14.2 L15.6 13.9 Z" fill="#000000" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
  </svg>
</div>

<div id="snap-preview"></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     FAKE FILESYSTEM
  ============================================================ */
  const FS = {
    root: {
      type:'folder', name:'Home',
      children:{
        'Documents': {type:'folder', name:'Documents', children:{
          'welcome.txt': {type:'file', name:'welcome.txt', content:'Welcome to Aether.\n\nThis is a simulated desktop OS running entirely in your browser — no install, no server, just HTML, CSS and JavaScript.\n\nTry the Terminal, drag windows around, or open Settings to change the accent color.'},
          'todo.txt': {type:'file', name:'todo.txt', content:'- build an OS\n- make it feel real\n- add a terminal\n- ship it'}
        }},
        'Desktop': {type:'folder', name:'Desktop', children:{}},
        'Notes': {type:'folder', name:'Notes', children:{
          'ideas.txt': {type:'file', name:'ideas.txt', content:'Random ideas go here.'}
        }},
      }
    }
  };
  function pathParts(p){return p.split('/').filter(Boolean);}
  function getNode(path){
    let node = FS.root;
    for(const part of pathParts(path)){
      if(!node.children || !node.children[part]) return null;
      node = node.children[part];
    }
    return node;
  }

  /* ============================================================
     UTIL
  ============================================================ */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function pad(n){return n.toString().padStart(2,'0');}
  function updateClock(){
    const d = new Date();
    let h = d.getHours(); const ampm = h>=12?'PM':'AM'; h = h%12; if(h===0)h=12;
    const timeStr = `${h}:${pad(d.getMinutes())} ${ampm}`;
    const el1 = document.getElementById('mb-clock'); if(el1) el1.textContent = timeStr;
    const el2 = document.getElementById('lockClock'); if(el2) el2.textContent = `${h}:${pad(d.getMinutes())}`;
    const el3 = document.getElementById('lockDate');
    if(el3) el3.textContent = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  }
  updateClock(); setInterval(updateClock, 15000);

  /* ============================================================
     MOBILE CURSOR — a visible pointer that follows touch input
  ============================================================ */
  const mcursor = document.getElementById('mcursor');
  let cursorHideTimer = null;
  function moveCursor(x,y){
    mcursor.style.transform = `translate(${x-1}px, ${y-1}px)`;
    mcursor.classList.add('show');
    clearTimeout(cursorHideTimer);
  }
  document.addEventListener('touchstart', (e)=>{
    const t = e.touches[0]; if(!t) return;
    moveCursor(t.clientX, t.clientY);
    mcursor.classList.add('tap');
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    const t = e.touches[0]; if(!t) return;
    moveCursor(t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener('touchend', ()=>{
    mcursor.classList.remove('tap');
    clearTimeout(cursorHideTimer);
    cursorHideTimer = setTimeout(()=>mcursor.classList.remove('show'), 2200);
  }, {passive:true});

  /* ============================================================
     BOOT + LOCK SEQUENCE
  ============================================================ */
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      document.getElementById('boot').classList.add('hide');
    }, 1900);
  });

  let osPassword = '';
  let passwordEnabled = false;
  const lockEl = document.getElementById('lock');
  const lockPassRow = document.getElementById('lockPassRow');
  const lockHint = document.getElementById('lockHint');
  const lockPassInput = document.getElementById('lockPassInput');
  const lockError = document.getElementById('lockError');

  function showLockPassUI(show){
    lockPassRow.style.display = show ? 'flex' : 'none';
    lockHint.style.display = show ? 'none' : 'block';
    lockError.textContent = '';
  }
  function unlockNow(){
    lockEl.classList.add('hide');
    lockError.textContent = '';
    lockPassInput.value = '';
  }
  function checkPassword(){
    if(lockPassInput.value === osPassword && osPassword !== ''){
      unlockNow();
    } else {
      lockPassRow.classList.add('shake');
      lockError.textContent = 'Incorrect password';
      setTimeout(()=>lockPassRow.classList.remove('shake'), 400);
      lockPassInput.value = '';
      lockPassInput.focus();
    }
  }
  function relock(){
    showLockPassUI(passwordEnabled);
    lockEl.classList.remove('hide');
    if(passwordEnabled) setTimeout(()=>lockPassInput.focus(), 300);
  }

  lockEl.addEventListener('click', function(e){
    if(passwordEnabled){
      if(e.target.closest('#lockPassRow')) return;
      lockPassInput.focus();
      return;
    }
    unlockNow();
  });
  document.getElementById('lockUnlockBtn').addEventListener('click', (e)=>{ e.stopPropagation(); checkPassword(); });
  lockPassInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkPassword(); });
  lockPassInput.addEventListener('click', (e)=>e.stopPropagation());

  /* ============================================================
     WINDOW MANAGER
  ============================================================ */
  const desktop = document.getElementById('desktop');
  let zTop = 10;
  const openWindows = {}; // appId -> array of win elements
  let cascade = 0;

  function setActiveAppName(name){ document.getElementById('activeAppName').textContent = name; }

  function bringToFront(win){
    zTop++; win.style.zIndex = zTop;
    document.querySelectorAll('.win').forEach(w=>w.classList.remove('focused'));
    win.classList.add('focused');
    setActiveAppName(win.dataset.appTitle);
  }

  function setDockRunning(appId, running){
    document.querySelectorAll(`.dock-item[data-app="${appId}"]`).forEach(d=>d.classList.toggle('running', running));
  }

  /* ---- window snapping ---- */
  const snapPreviewEl = document.getElementById('snap-preview');
  const SNAP_EDGE = 26;
  function getSnapZone(x, y){
    if(y <= 32 + SNAP_EDGE) return 'full';
    if(x <= SNAP_EDGE) return 'left';
    if(x >= window.innerWidth - SNAP_EDGE) return 'right';
    return null;
  }
  function snapRect(zone){
    const top = 32;
    if(zone==='left') return {left:0, top, width:window.innerWidth/2, height:window.innerHeight-top};
    if(zone==='right') return {left:window.innerWidth/2, top, width:window.innerWidth/2, height:window.innerHeight-top};
    return {left:0, top, width:window.innerWidth, height:window.innerHeight-top};
  }
  function showSnapPreview(zone){
    if(!zone){ snapPreviewEl.classList.remove('show'); return; }
    const r = snapRect(zone);
    snapPreviewEl.style.left = r.left+'px'; snapPreviewEl.style.top = r.top+'px';
    snapPreviewEl.style.width = r.width+'px'; snapPreviewEl.style.height = r.height+'px';
    snapPreviewEl.classList.add('show');
  }
  function hideSnapPreview(){ snapPreviewEl.classList.remove('show'); }
  function applySnap(win, zone){
    const r = snapRect(zone);
    win.classList.add('anim-resize');
    win.style.left = r.left+'px'; win.style.top = r.top+'px';
    win.style.width = r.width+'px'; win.style.height = r.height+'px';
    if(zone==='full'){ win.classList.add('max'); win.dataset.max='1'; }
    else { win.classList.remove('max'); win.dataset.max=''; }
    setTimeout(()=>win.classList.remove('anim-resize'), 340);
  }

  function createWindow({appId, title, icon, width, height, content, onMount}){
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.app = appId;
    win.dataset.appTitle = title;
    cascade = (cascade + 1) % 6;
    const left = 90 + cascade*32 + Math.random()*10;
    const top = 60 + cascade*26;
    win.style.left = left+'px';
    win.style.top = top+'px';
    win.style.width = (width||520)+'px';
    win.style.height = (height||380)+'px';

    win.innerHTML = `
      <div class="win-title">
        <div class="traffic">
          <button class="tlight close" data-act="close"><span>✕</span></button>
          <button class="tlight min" data-act="min"><span>–</span></button>
          <button class="tlight max" data-act="max"><span>▢</span></button>
        </div>
        <div class="win-titletext">${icon||''} ${title}</div>
      </div>
      <div class="win-body"></div>
      <div class="resize-handle"></div>
    `;
    const body = win.querySelector('.win-body');
    if(typeof content === 'string') body.innerHTML = content;
    else if(content instanceof Node) body.appendChild(content);

    desktop.appendChild(win);
    bringToFront(win);
    (openWindows[appId] = openWindows[appId]||[]).push(win);
    setDockRunning(appId, true);

    // dragging
    const titleBar = win.querySelector('.win-title');
    let dragging=false, dx=0, dy=0, activeSnap=null;
    titleBar.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.tlight')) return;
      dragging = true; bringToFront(win);
      dx = e.clientX - win.offsetLeft; dy = e.clientY - win.offsetTop;
      e.preventDefault();
    });
    window.addEventListener('mousemove',(e)=>{
      if(!dragging) return;
      win.style.left = Math.max(0, e.clientX-dx)+'px';
      win.style.top = Math.max(32, e.clientY-dy)+'px';
      activeSnap = getSnapZone(e.clientX, e.clientY);
      showSnapPreview(activeSnap);
    });
    window.addEventListener('mouseup',()=>{
      if(dragging && activeSnap) applySnap(win, activeSnap);
      dragging=false;
      hideSnapPreview();
      activeSnap = null;
    });
    win.addEventListener('mousedown', ()=>bringToFront(win));

    // resize
    const handle = win.querySelector('.resize-handle');
    let resizing=false, rw=0, rh=0, rx=0, ry=0;
    handle.addEventListener('mousedown',(e)=>{
      resizing=true; rw=win.offsetWidth; rh=win.offsetHeight; rx=e.clientX; ry=e.clientY;
      e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('mousemove',(e)=>{
      if(!resizing) return;
      win.style.width = Math.max(280, rw + (e.clientX-rx))+'px';
      win.style.height = Math.max(180, rh + (e.clientY-ry))+'px';
    });
    window.addEventListener('mouseup',()=>resizing=false);

    // traffic lights
    win.querySelector('[data-act="close"]').addEventListener('click', ()=>closeWindow(win));
    win.querySelector('[data-act="min"]').addEventListener('click', ()=>minimizeWindow(win));
    win.querySelector('[data-act="max"]').addEventListener('click', ()=>toggleMax(win));
    win.querySelector('.win-title').addEventListener('dblclick', (e)=>{ if(!e.target.closest('.tlight')) toggleMax(win); });

    if(onMount) onMount(body, win);
    return win;
  }

  function closeWindow(win){
    if(typeof win._cleanup === 'function'){ try{ win._cleanup(); }catch(e){} }
    win.classList.add('closing');
    setTimeout(()=>{
      win.remove();
      const appId = win.dataset.app;
      openWindows[appId] = (openWindows[appId]||[]).filter(w=>w!==win);
      if(!openWindows[appId] || !openWindows[appId].length) setDockRunning(appId, false);
    }, 170);
  }
  function dockTargetFor(win){
    const dockIcon = document.querySelector(`.dock-item[data-app="${win.dataset.app}"]`);
    const wRect = win.getBoundingClientRect();
    if(!dockIcon) return {tx:0, ty:window.innerHeight, sx:0.06, sy:0.04};
    const dRect = dockIcon.getBoundingClientRect();
    const tx = (dRect.left + dRect.width/2) - (wRect.left + wRect.width/2);
    const ty = (dRect.top + dRect.height/2) - (wRect.top + wRect.height/2);
    return {tx, ty, sx: Math.max(0.04, dRect.width / wRect.width), sy: Math.max(0.03, dRect.height / wRect.height)};
  }
  function minimizeWindow(win){
    const {tx, ty, sx, sy} = dockTargetFor(win);
    win.style.transformOrigin = 'center center';
    win.style.transition = 'transform .42s cubic-bezier(.55,0,.85,.35), opacity .38s ease .05s';
    win.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    win.style.opacity = '0.15';
    win.dataset.minimized = '1';
    setTimeout(()=>{ win.style.display='none'; }, 420);
  }
  function restoreWindow(win){
    win.style.display='flex';
    win.style.transition = 'none';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        win.style.transition = 'transform .38s cubic-bezier(.16,1,.3,1), opacity .3s ease';
        win.style.transform='none'; win.style.opacity='1';
        win.dataset.minimized='';
        bringToFront(win);
      });
    });
  }
  function toggleMax(win){
    win.classList.add('anim-resize');
    if(win.dataset.max === '1'){
      win.style.left = win.dataset.pl; win.style.top = win.dataset.pt;
      win.style.width = win.dataset.pw; win.style.height = win.dataset.ph;
      win.classList.remove('max'); win.dataset.max='';
    } else {
      win.dataset.pl = win.style.left; win.dataset.pt = win.style.top;
      win.dataset.pw = win.style.width; win.dataset.ph = win.style.height;
      win.style.left='0px'; win.style.top='32px'; win.style.width='100vw'; win.style.height='calc(100vh - 32px)';
      win.classList.add('max'); win.dataset.max='1';
    }
    setTimeout(()=>win.classList.remove('anim-resize'), 340);
  }

  /* ============================================================
     APP LAUNCHER
  ============================================================ */
  function launchApp(appId){
    // if minimized instance exists, restore it instead of opening new
    const existing = (openWindows[appId]||[]).find(w=>w.dataset.minimized==='1');
    if(existing){ restoreWindow(existing); return; }
    if((appId==='settings'||appId==='calculator') && openWindows[appId] && openWindows[appId].length){
      bringToFront(openWindows[appId][0]); return;
    }
    APPS[appId] && APPS[appId]();
  }

  document.querySelectorAll('[data-app]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const appId = el.dataset.app;
      if(appId==='trash'){ toast('Trash is empty'); return; }
      launchApp(appId);
    });
    el.addEventListener('dblclick', ()=>{
      const appId = el.dataset.app;
      if(appId==='trash'){ toast('Trash is empty'); return; }
      launchApp(appId);
    });
  });

  /* ============================================================
     APP: FILES
  ============================================================ */
  function iconFor(node){ return node.type==='folder' ? '📁' : '📄'; }

  function openFilesApp(startPath){
    let currentPath = startPath || '';
    createWindow({
      appId:'files', title:'Files', icon:'🗂️', width:620, height:420,
      onMount:(body)=>{
        body.innerHTML = `
          <div class="fe-wrap">
            <div class="fe-side">
              <div class="fe-side-item" data-p="">🏠 Home</div>
              <div class="fe-side-item" data-p="Documents">📁 Documents</div>
              <div class="fe-side-item" data-p="Desktop">📁 Desktop</div>
              <div class="fe-side-item" data-p="Notes">📁 Notes</div>
            </div>
            <div class="fe-main">
              <div class="fe-crumb" id="fe-crumb"></div>
              <div class="fe-grid" id="fe-grid"></div>
            </div>
          </div>`;
        const side = body.querySelectorAll('.fe-side-item');
        const grid = body.querySelector('#fe-grid');
        const crumb = body.querySelector('#fe-crumb');

        function render(){
          const node = getNode(currentPath) || FS.root;
          crumb.textContent = '/ ' + (currentPath ? currentPath.replace(/\//g,' / ') : 'Home');
          side.forEach(s=>s.classList.toggle('active', s.dataset.p === currentPath));
          grid.innerHTML='';
          const keys = Object.keys(node.children||{});
          if(!keys.length){ grid.innerHTML = '<div class="fe-empty">This folder is empty</div>'; return; }
          keys.forEach(k=>{
            const child = node.children[k];
            const item = document.createElement('div');
            item.className='fe-item';
            item.innerHTML = `<div class="fi">${iconFor(child)}</div><div class="fl">${child.name}</div>`;
            item.addEventListener('dblclick', ()=>{
              if(child.type==='folder'){
                currentPath = currentPath ? currentPath+'/'+k : k;
                render();
              } else {
                openNotesApp(currentPath ? currentPath+'/'+k : k, child);
              }
            });
            grid.appendChild(item);
          });
        }
        side.forEach(s=>s.addEventListener('click', ()=>{ currentPath = s.dataset.p; render(); }));
        render();
      }
    });
  }

  /* ============================================================
     APP: NOTES
  ============================================================ */
  function openNotesApp(path, node){
    const isNew = !node;
    let fileNode = node;
    createWindow({
      appId:'notes', title: isNew ? 'Untitled — Notes' : node.name + ' — Notes', icon:'📝', width:460, height:400,
      onMount:(body)=>{
        body.style.display='flex'; body.style.flexDirection='column';
        body.innerHTML = `<div class="notes-tab">${isNew ? 'Untitled.txt (unsaved)' : path}</div>
          <textarea class="notes-area" spellcheck="false">${fileNode ? fileNode.content : ''}</textarea>`;
        const area = body.querySelector('textarea');
        area.addEventListener('input', ()=>{
          if(fileNode) fileNode.content = area.value;
        });
        area.focus();
      }
    });
  }

  /* ============================================================
     APP: TERMINAL
  ============================================================ */
  function openTerminalApp(){
    let cwd = '';
    createWindow({
      appId:'terminal', title:'Terminal', icon:'⌨️', width:560, height:360,
      onMount:(body)=>{
        body.innerHTML = `<div class="term" id="termOut"></div>`;
        const out = body.querySelector('#termOut');

        function promptStr(){ return `guest@aether ${cwd ? '~/'+cwd.replace(/\//g,'/') : '~'} % `; }
        function println(text){
          const div = document.createElement('div');
          div.className='term-line';
          div.textContent = text;
          out.appendChild(div);
          out.scrollTop = out.scrollHeight;
        }
        function printHTML(html){
          const div = document.createElement('div');
          div.className='term-line';
          div.innerHTML = html;
          out.appendChild(div);
          out.scrollTop = out.scrollHeight;
        }
        function newInputLine(){
          const row = document.createElement('div');
          row.className='term-input-row term-line';
          row.innerHTML = `<span class="term-prompt">${promptStr()}</span><input class="term-input" autocapitalize="off" autocomplete="off" spellcheck="false"/>`;
          out.appendChild(row);
          const input = row.querySelector('input');
          input.focus();
          input.addEventListener('keydown',(e)=>{
            if(e.key==='Enter'){
              const val = input.value;
              input.disabled = true;
              runCmd(val.trim());
            }
          });
          out.scrollTop = out.scrollHeight;
        }
        function runCmd(cmdline){
          if(cmdline) println(promptStr()+cmdline);
          const [cmd, ...args] = cmdline.split(/\s+/).filter(Boolean);
          switch(cmd){
            case undefined: break;
            case 'help':
              println('Available commands: ls, cd, cat, pwd, whoami, date, clear, neofetch, echo, mkdir, help');
              break;
            case 'ls': {
              const node = getNode(cwd) || FS.root;
              const keys = Object.keys(node.children||{});
              println(keys.length ? keys.join('   ') : '(empty)');
              break;
            }
            case 'cd': {
              const target = args[0];
              if(!target || target==='~'){ cwd=''; break; }
              if(target==='..'){ const parts=pathParts(cwd); parts.pop(); cwd=parts.join('/'); break; }
              const newPath = cwd ? cwd+'/'+target : target;
              const node = getNode(newPath);
              if(node && node.type==='folder') cwd = newPath;
              else println(`cd: no such directory: ${target}`);
              break;
            }
            case 'pwd':
              println('/' + cwd); break;
            case 'cat': {
              const target = args[0];
              if(!target){ println('usage: cat <file>'); break; }
              const node = getNode(cwd ? cwd+'/'+target : target);
              if(node && node.type==='file') println(node.content);
              else println(`cat: ${target}: No such file`);
              break;
            }
            case 'mkdir': {
              const node = getNode(cwd) || FS.root;
              if(args[0]){ node.children = node.children||{}; node.children[args[0]] = {type:'folder', name:args[0], children:{}}; println(`created folder ${args[0]}`);}
              break;
            }
            case 'echo': println(args.join(' ')); break;
            case 'whoami': println('guest'); break;
            case 'date': println(new Date().toString()); break;
            case 'clear': out.innerHTML=''; newInputLine(); return;
            case 'neofetch':
              printHTML(`<span style="color:#e8935b">Aether OS</span> — web edition<br>Kernel: JavaScript (ES2023)<br>Shell: aetherterm<br>UI: HTML/CSS glass-shell<br>Uptime: ${Math.floor(performance.now()/1000)}s`);
              break;
            case 'sudo': println("Nice try. This isn't that kind of OS."); break;
            default: println(`command not found: ${cmd}`);
          }
          newInputLine();
        }
        println('Aether Terminal — type "help" to see available commands.');
        newInputLine();
        body.addEventListener('click', ()=>{
          const last = out.querySelector('.term-input-row:last-child input');
          if(last && !last.disabled) last.focus();
        });
      }
    });
  }

  /* ============================================================
     APP: CALCULATOR
  ============================================================ */
  function openCalculatorApp(){
    createWindow({
      appId:'calculator', title:'Calculator', icon:'🧮', width:280, height:380,
      onMount:(body)=>{
        body.innerHTML = `
          <div class="calc">
            <div class="calc-screen" id="calcScreen">0</div>
            <div class="calc-grid">
              ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>{
                const isOp = ['÷','×','−','+'].includes(k);
                const isEq = k==='=';
                return `<button class="calc-btn ${isOp?'op':''} ${isEq?'eq':''}" data-k="${k}" style="${k==='0'?'grid-column:span 2':''}">${k}</button>`;
              }).join('')}
            </div>
          </div>`;
        const screen = body.querySelector('#calcScreen');
        let expr = '';
        function render(){ screen.textContent = expr || '0'; }
        body.querySelectorAll('.calc-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const k = btn.dataset.k;
            if(k==='C'){ expr=''; }
            else if(k==='⌫'){ expr = expr.slice(0,-1); }
            else if(k==='='){
              try{
                const safe = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
                if(!/^[0-9+\-*/.() ]+$/.test(safe)) throw 0;
                // eslint-disable-next-line no-eval
                const result = Function('"use strict";return ('+safe+')')();
                expr = String(Math.round(result*1e8)/1e8);
              }catch(e){ expr='Error'; }
            } else if(k==='±'){
              expr = expr.startsWith('-') ? expr.slice(1) : '-'+expr;
            } else {
              expr += k;
            }
            render();
          });
        });
        render();
      }
    });
  }

  /* ============================================================
     APP: SETTINGS
  ============================================================ */
  const ACCENTS = {
    copper:'#e8935b', teal:'#7fe3d6', violet:'#a78bfa', rose:'#f0708f', lime:'#b9e86b'
  };
  function applyAccent(hex){
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-soft', hex+'52');
  }
  function openSettingsApp(){
    createWindow({
      appId:'settings', title:'Settings', icon:'⚙️', width:400, height:440,
      onMount:(body)=>{
        body.innerHTML = `<div class="app-pad">
          <h3 class="section-h">Appearance</h3>
          <div class="settings-row">
            <div><div class="settings-label">Accent color</div><div class="settings-sub">Used across windows, dock and highlights</div></div>
            <div style="display:flex;gap:8px;" id="swatches"></div>
          </div>
          <div class="settings-row">
            <div><div class="settings-label">Reduce motion</div><div class="settings-sub">Simplifies window and dock animations</div></div>
            <div class="toggle" id="motionToggle"><div class="toggle-knob"></div></div>
          </div>
          <h3 class="section-h">Security</h3>
          <div class="settings-row">
            <div><div class="settings-label">Require password to unlock</div><div class="settings-sub">Ask for a password when the screen locks</div></div>
            <div class="toggle" id="passToggle"><div class="toggle-knob"></div></div>
          </div>
          <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:8px;">
            <div class="settings-label">Set password</div>
            <div style="display:flex;gap:8px;">
              <input id="setPassInput" type="password" placeholder="New password" autocomplete="off" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);border-radius:10px;padding:9px 12px;color:var(--text-primary);outline:none;font-family:var(--font-body);font-size:13px;">
              <button id="savePassBtn" style="background:var(--accent);border:none;border-radius:10px;padding:0 16px;color:#1a1006;font-weight:700;cursor:pointer;font-size:13px;">Save</button>
            </div>
            <div class="settings-sub" id="passStatus"></div>
          </div>
          <div class="settings-row">
            <div><div class="settings-label">Lock screen now</div><div class="settings-sub">Test your lock screen instantly</div></div>
            <button id="lockNowBtn" style="background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:7px 14px;color:var(--text-primary);cursor:pointer;font-size:12.5px;">Lock</button>
          </div>
          <h3 class="section-h">About</h3>
          <div style="padding:14px 4px;">
            <svg class="about-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="4"/><path d="M20 34 L28 42 L45 22" fill="none" stroke="#f1ede7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-family:var(--font-display);font-weight:700;font-size:16px;">Aether OS</div>
            <div class="settings-sub" style="margin-top:4px;">Web Edition · Build 1.0<br>A desktop environment made of HTML, CSS and JavaScript. No install required.</div>
          </div>
        </div>`;
        const sw = body.querySelector('#swatches');
        Object.entries(ACCENTS).forEach(([name,hex])=>{
          const d = document.createElement('div');
          d.className='swatch'+(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()===hex?' active':'');
          d.style.background = hex;
          d.addEventListener('click', ()=>{
            applyAccent(hex);
            sw.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
            d.classList.add('active');
            toast('Accent updated');
          });
          sw.appendChild(d);
        });
        const motionToggle = body.querySelector('#motionToggle');
        motionToggle.addEventListener('click', ()=>{
          motionToggle.classList.toggle('on');
          document.body.style.setProperty('--motion', motionToggle.classList.contains('on') ? '0' : '1');
          toast(motionToggle.classList.contains('on') ? 'Motion reduced' : 'Motion restored');
        });

        const passToggle = body.querySelector('#passToggle');
        const passStatus = body.querySelector('#passStatus');
        function renderPassStatus(){
          passStatus.textContent = osPassword ? 'Password is set for this session.' : 'No password set yet.';
        }
        passToggle.classList.toggle('on', passwordEnabled);
        renderPassStatus();
        passToggle.addEventListener('click', ()=>{
          if(!osPassword){ toast('Set a password first'); return; }
          passwordEnabled = !passwordEnabled;
          passToggle.classList.toggle('on', passwordEnabled);
          toast(passwordEnabled ? 'Password required to unlock' : 'Password requirement off');
        });
        body.querySelector('#savePassBtn').addEventListener('click', ()=>{
          const input = body.querySelector('#setPassInput');
          if(!input.value){ toast('Enter a password first'); return; }
          osPassword = input.value;
          input.value = '';
          renderPassStatus();
          toast('Password saved for this session');
        });
        body.querySelector('#lockNowBtn').addEventListener('click', ()=>relock());
      }
    });
  }

  /* ============================================================
     APP: BROWSER
  ============================================================ */
  function openBrowserApp(){
    const pages = {
      'aether://home': {title:'New Tab', html:`<div style="text-align:center;padding:60px 20px;">
          <div style="font-size:40px;">🧭</div>
          <div style="font-family:var(--font-display);font-size:20px;margin-top:10px;">Aether Browser</div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:6px;">Pick a bookmark below to get started</div>
        </div>`},
      'aether://docs': {title:'Aether Docs', html:`<div style="padding:24px;"><h2 style="font-family:var(--font-display);margin-top:0;">Documentation</h2><p style="color:var(--text-muted);line-height:1.6;font-size:13.5px;">Aether is a simulated desktop built entirely with HTML, CSS and JavaScript. Every app you see — Files, Terminal, this Browser — runs client-side with no backend or real network calls.</p></div>`},
      'aether://weather': {title:'Weather', html:`<div style="padding:24px;text-align:center;"><div style="font-size:52px;">🌤️</div><div style="font-family:var(--font-display);font-size:32px;margin-top:8px;">21°C</div><div style="color:var(--text-muted);font-size:13px;">Partly cloudy · Feels like 20°</div></div>`},
      'aether://news': {title:'Daily Brief', html:`<div style="padding:24px;"><h2 style="font-family:var(--font-display);margin-top:0;">Daily Brief</h2><ul style="color:var(--text-muted);line-height:1.9;font-size:13.5px;padding-left:18px;"><li>Aether OS reaches build 1.0</li><li>Glass UI now supports custom accents</li><li>Terminal adds neofetch command</li></ul></div>`},
    };
    let current = 'aether://home';
    createWindow({
      appId:'browser', title:'Browser', icon:'🧭', width:560, height:420,
      onMount:(body)=>{
        body.style.display='flex'; body.style.flexDirection='column';
        body.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);">
            <span style="cursor:pointer;opacity:.7;">←</span>
            <span style="cursor:pointer;opacity:.4;">→</span>
            <div id="brUrl" style="flex:1;background:rgba(255,255,255,0.06);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--font-mono);color:var(--text-muted);"></div>
          </div>
          <div id="brBody" style="flex:1;overflow:auto;"></div>
          <div style="display:flex;gap:6px;padding:8px 10px;border-top:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;">
            ${Object.keys(pages).map(u=>`<div class="fe-side-item" data-u="${u}" style="cursor:pointer;">${pages[u].title}</div>`).join('')}
          </div>`;
        const brBody = body.querySelector('#brBody');
        const brUrl = body.querySelector('#brUrl');
        function nav(u){ current = u; brUrl.textContent = u; brBody.innerHTML = pages[u].html; }
        body.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click', ()=>nav(b.dataset.u)));
        nav(current);
      }
    });
  }

  /* ============================================================
     APP: MUSIC
  ============================================================ */
  function openMusicApp(){
    const tracks = [
      {t:'Night Drive', a:'Aether Sound', len:198},
      {t:'Glass Horizon', a:'Aether Sound', len:224},
      {t:'Copper Skies', a:'Aether Sound', len:167},
    ];
    let idx = 0, playing = false, elapsed = 0, timer = null;
    createWindow({
      appId:'music', title:'Music', icon:'🎵', width:340, height:460,
      onMount:(body, win)=>{
        body.innerHTML = `
          <div style="padding:20px;display:flex;flex-direction:column;height:100%;">
            <div style="width:100%;aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--cool));margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:44px;">🎧</div>
            <div style="font-family:var(--font-display);font-weight:700;font-size:16px;" id="musicTitle"></div>
            <div style="color:var(--text-muted);font-size:13px;margin-bottom:14px;" id="musicArtist"></div>
            <div style="height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-bottom:6px;overflow:hidden;"><div id="musicProgress" style="height:100%;width:0%;background:var(--accent);"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:18px;"><span id="musicElapsed">0:00</span><span id="musicTotal">0:00</span></div>
            <div style="display:flex;justify-content:center;align-items:center;gap:24px;">
              <div style="cursor:pointer;font-size:20px;" id="musicPrev">⏮</div>
              <div style="cursor:pointer;font-size:36px;" id="musicPlay">▶️</div>
              <div style="cursor:pointer;font-size:20px;" id="musicNext">⏭</div>
            </div>
          </div>`;
        const titleEl = body.querySelector('#musicTitle');
        const artistEl = body.querySelector('#musicArtist');
        const progEl = body.querySelector('#musicProgress');
        const elapsedEl = body.querySelector('#musicElapsed');
        const totalEl = body.querySelector('#musicTotal');
        const playBtn = body.querySelector('#musicPlay');
        function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
        function render(){
          titleEl.textContent = tracks[idx].t;
          artistEl.textContent = tracks[idx].a;
          totalEl.textContent = fmt(tracks[idx].len);
          elapsedEl.textContent = fmt(elapsed);
          progEl.style.width = (elapsed/tracks[idx].len*100)+'%';
          playBtn.textContent = playing ? '⏸' : '▶️';
        }
        function tick(){ elapsed++; if(elapsed >= tracks[idx].len){ next(); return; } render(); }
        function play(){ playing = true; clearInterval(timer); timer = setInterval(tick, 1000); render(); }
        function pause(){ playing = false; clearInterval(timer); render(); }
        function next(){ idx = (idx+1)%tracks.length; elapsed=0; render(); if(playing) play(); }
        function prev(){ idx = (idx-1+tracks.length)%tracks.length; elapsed=0; render(); if(playing) play(); }
        playBtn.addEventListener('click', ()=> playing ? pause() : play());
        body.querySelector('#musicNext').addEventListener('click', next);
        body.querySelector('#musicPrev').addEventListener('click', prev);
        win._cleanup = ()=>clearInterval(timer);
        render();
      }
    });
  }

  /* ============================================================
     APP: PHOTOS
  ============================================================ */
  function openPhotosApp(){
    const photos = [
      {name:'Sunset Ridge', grad:'linear-gradient(135deg,#e8935b,#f2c078)'},
      {name:'Deep Ocean', grad:'linear-gradient(135deg,#1c3f52,#7fe3d6)'},
      {name:'Violet Dusk', grad:'linear-gradient(135deg,#372a5e,#a78bfa)'},
      {name:'Forest Floor', grad:'linear-gradient(135deg,#1e3a24,#b9e86b)'},
      {name:'Rose Fade', grad:'linear-gradient(135deg,#4a1f2c,#f0708f)'},
      {name:'Midnight', grad:'linear-gradient(135deg,#0a0c11,#2a2e3a)'},
    ];
    createWindow({
      appId:'photos', title:'Photos', icon:'🖼️', width:520, height:400,
      onMount:(body)=>{
        body.style.position='relative';
        body.innerHTML = `<div class="app-pad"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;" id="photoGrid"></div></div>
          <div id="photoOverlay" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,7,10,0.85);backdrop-filter:blur(10px);"></div>`;
        const grid = body.querySelector('#photoGrid');
        const overlay = body.querySelector('#photoOverlay');
        photos.forEach(p=>{
          const tile = document.createElement('div');
          tile.style.cssText = `aspect-ratio:1;border-radius:12px;background:${p.grad};cursor:pointer;position:relative;overflow:hidden;`;
          tile.innerHTML = `<div style="position:absolute;bottom:0;left:0;right:0;padding:6px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.5));">${p.name}</div>`;
          tile.addEventListener('click', ()=>{
            overlay.style.display='flex';
            overlay.innerHTML = `<div style="width:80%;max-width:380px;aspect-ratio:1;border-radius:18px;background:${p.grad};box-shadow:0 30px 60px rgba(0,0,0,.5);"></div>`;
          });
          grid.appendChild(tile);
        });
        overlay.addEventListener('click', ()=>{ overlay.style.display='none'; });
      }
    });
  }

  const APPS = {
    files: ()=>openFilesApp(''),
    notes: ()=>openNotesApp(null, null),
    terminal: openTerminalApp,
    calculator: openCalculatorApp,
    settings: openSettingsApp,
    browser: openBrowserApp,
    music: openMusicApp,
    photos: openPhotosApp,
  };

  /* ============================================================
     LAUNCHER (START MENU)
  ============================================================ */
  const APP_META = [
    {id:'files', name:'Files', icon:'🗂️'},
    {id:'notes', name:'Notes', icon:'📝'},
    {id:'terminal', name:'Terminal', icon:'⌨️'},
    {id:'browser', name:'Browser', icon:'🧭'},
    {id:'music', name:'Music', icon:'🎵'},
    {id:'photos', name:'Photos', icon:'🖼️'},
    {id:'calculator', name:'Calculator', icon:'🧮'},
    {id:'settings', name:'Settings', icon:'⚙️'},
    {id:'lock', name:'Lock Screen', icon:'🔒'},
    {id:'trash', name:'Trash', icon:'🗑️'},
  ];
  const launcher = document.getElementById('launcher');
  const launcherSearch = document.getElementById('launcherSearch');
  const launcherGrid = document.getElementById('launcherGrid');
  const launcherEmpty = document.getElementById('launcherEmpty');
  let kbdIndex = 0;

  function renderLauncher(filter){
    const q = (filter||'').trim().toLowerCase();
    const items = APP_META.filter(a => a.name.toLowerCase().includes(q));
    launcherGrid.innerHTML = '';
    launcherEmpty.style.display = items.length ? 'none' : 'block';
    kbdIndex = 0;
    items.forEach((a, i)=>{
      const el = document.createElement('div');
      el.className = 'launcher-item'+(i===0?' kbd-sel':'');
      el.dataset.app = a.id;
      el.innerHTML = `<div class="li-icn">${a.icon}</div><div class="li-lbl">${a.name}</div>`;
      el.addEventListener('click', ()=>launchFromLauncher(a.id));
      launcherGrid.appendChild(el);
    });
  }
  function launchFromLauncher(appId){
    closeLauncher();
    if(appId==='trash'){ toast('Trash is empty'); return; }
    if(appId==='lock'){ relock(); return; }
    launchApp(appId);
  }
  function openLauncher(){
    launcherSearch.value = '';
    renderLauncher('');
    launcher.classList.add('open');
    setTimeout(()=>launcherSearch.focus(), 60);
  }
  function closeLauncher(){ launcher.classList.remove('open'); }
  function toggleLauncher(){ launcher.classList.contains('open') ? closeLauncher() : openLauncher(); }

  document.getElementById('mbLogo').addEventListener('click', (e)=>{ e.stopPropagation(); toggleLauncher(); });
  launcherSearch.addEventListener('input', ()=>renderLauncher(launcherSearch.value));
  launcher.addEventListener('mousedown', (e)=>{ if(e.target===launcher) closeLauncher(); });
  launcherSearch.addEventListener('keydown', (e)=>{
    const items = Array.from(launcherGrid.querySelectorAll('.launcher-item'));
    if(!items.length) return;
    if(e.key==='ArrowRight' || e.key==='ArrowDown'){
      e.preventDefault();
      items[kbdIndex].classList.remove('kbd-sel');
      kbdIndex = Math.min(items.length-1, kbdIndex+1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){
      e.preventDefault();
      items[kbdIndex].classList.remove('kbd-sel');
      kbdIndex = Math.max(0, kbdIndex-1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      launchFromLauncher(items[kbdIndex].dataset.app);
    }
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeLauncher();
  });

  /* ============================================================
     DESKTOP RIGHT-CLICK CONTEXT MENU
  ============================================================ */
  let ctxEl = null;
  function closeCtx(){ if(ctxEl){ ctxEl.remove(); ctxEl=null; } }
  document.addEventListener('click', closeCtx);
  desktop.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    closeCtx();
    ctxEl = document.createElement('div');
    ctxEl.className='ctx';
    ctxEl.style.left = e.clientX+'px';
    ctxEl.style.top = e.clientY+'px';
    ctxEl.innerHTML = `
      <div class="ctx-item" data-a="new">📄 New Text File</div>
      <div class="ctx-item" data-a="files">🗂️ Open Files</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-a="settings">⚙️ Settings</div>
      <div class="ctx-item" data-a="about">ℹ️ About Aether</div>
    `;
    document.body.appendChild(ctxEl);
    ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        const a = it.dataset.a;
        if(a==='new') openNotesApp(null,null);
        if(a==='files') openFilesApp('');
        if(a==='settings') openSettingsApp();
        if(a==='about') openSettingsApp();
      });
    });
  });

  /* ============================================================
     DESKTOP ICON SELECTION
  ============================================================ */
  document.querySelectorAll('.dicon').forEach(ic=>{
    ic.addEventListener('click',(e)=>{
      e.stopPropagation();
      document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel'));
      ic.classList.add('sel');
    });
  });
  desktop.addEventListener('click', ()=>document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel')));

})();
</script>
