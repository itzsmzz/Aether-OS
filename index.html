  /* ============================================================
     APP: FILES
  ============================================================ */
  function iconFor(node){
    if(node.type==='folder') return iconSvg('files', 30, 1.5);
    if(node.type==='image') return iconSvg('photos', 30, 1.5);
    return iconSvg('file', 30, 1.5);
  }

  function isSameOrDescendantPath(basePath, targetPath){
    if(targetPath === basePath) return true;
    return targetPath.indexOf(basePath + '/') === 0;
  }
  function moveNode(fromPath, key, toPath){
    if(fromPath === toPath) return false;
    const fromNode = getNode(fromPath) || FS.root;
    const toNode = getNode(toPath) || FS.root;
    const moving = fromNode.children && fromNode.children[key];
    if(!moving) return false;
    const movingFullPath = fromPath ? fromPath+'/'+key : key;
    if(moving.type === 'folder' && isSameOrDescendantPath(movingFullPath, toPath)){
      toast("Can't move a folder into itself");
      return false;
    }
    if(toNode.children && toNode.children[key]){
      toast(`"${key}" already exists there`);
      return false;
    }
    toNode.children = toNode.children || {};
    toNode.children[key] = moving;
    delete fromNode.children[key];
    persistFS();
    document.dispatchEvent(new CustomEvent('fs-changed'));
    return true;
  }

  /* ============================================================
     TOUCH DRAG-AND-DROP — long-press fallback for mobile, since
     native HTML5 drag events don't fire reliably on touchscreens
  ============================================================ */
  let touchDrag = null;
  const TOUCH_DRAG_CANCEL_PX = 10;
  const TOUCH_DRAG_HOLD_MS = 320;

  function positionDragGhost(x, y){
    if(touchDrag && touchDrag.ghostEl){
      touchDrag.ghostEl.style.transform = `translate(${x-22}px, ${y-22}px)`;
    }
  }
  document.addEventListener('touchstart', (e)=>{
    const item = e.target.closest('.fe-item[draggable="true"]');
    if(!item) return;
    const t = e.touches[0];
    touchDrag = {
      sourceEl: item,
      key: item.dataset.key,
      frompath: item.dataset.frompath || '',
      startX: t.clientX, startY: t.clientY,
      active: false, ghostEl: null, lastTarget: null,
      timer: setTimeout(()=>{
        if(!touchDrag) return;
        touchDrag.active = true;
        item.style.opacity = '0.35';
        const ghost = document.createElement('div');
        ghost.className = 'touch-drag-ghost';
        const fi = item.querySelector('.fi');
        ghost.innerHTML = fi ? fi.innerHTML : '';
        document.body.appendChild(ghost);
        touchDrag.ghostEl = ghost;
        positionDragGhost(t.clientX, t.clientY);
      }, TOUCH_DRAG_HOLD_MS)
    };
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!touchDrag) return;
    const t = e.touches[0]; if(!t) return;
    if(!touchDrag.active){
      if(Math.abs(t.clientX-touchDrag.startX) > TOUCH_DRAG_CANCEL_PX || Math.abs(t.clientY-touchDrag.startY) > TOUCH_DRAG_CANCEL_PX){
        clearTimeout(touchDrag.timer);
        touchDrag = null;
      }
      return;
    }
    e.preventDefault();
    positionDragGhost(t.clientX, t.clientY);
    if(touchDrag.lastTarget) touchDrag.lastTarget.classList.remove('drop-hover');
    const under = document.elementFromPoint(t.clientX, t.clientY);
    let target = null;
    if(under){
      const folderTarget = under.closest('.fe-item[data-fullpath]');
      const sideTarget = under.closest('.fe-side-item[data-p]');
      const trashTarget = under.closest('.dicon[data-app="trash"]');
      if(folderTarget && folderTarget !== touchDrag.sourceEl) target = folderTarget;
      else if(sideTarget) target = sideTarget;
      else if(trashTarget) target = trashTarget;
    }
    if(target){ target.classList.add('drop-hover'); touchDrag.lastTarget = target; }
    else { touchDrag.lastTarget = null; }
  }, {passive:false});

  document.addEventListener('touchend', ()=>{
    if(!touchDrag) return;
    clearTimeout(touchDrag.timer);
    if(touchDrag.active){
      touchDrag.sourceEl.style.opacity = '';
      if(touchDrag.ghostEl) touchDrag.ghostEl.remove();
      const target = touchDrag.lastTarget;
      if(target){
        target.classList.remove('drop-hover');
        if(target.matches('.dicon[data-app="trash"]')){
          const fromNode = getNode(touchDrag.frompath) || FS.root;
          if(fromNode.children && fromNode.children[touchDrag.key]){
            delete fromNode.children[touchDrag.key];
            persistFS();
            notify('trash', 'Moved to Trash', `"${touchDrag.key}" was deleted.`);
            document.dispatchEvent(new CustomEvent('fs-changed'));
          }
        } else {
          const destPath = target.dataset.fullpath !== undefined ? target.dataset.fullpath : target.dataset.p;
          if(moveNode(touchDrag.frompath, touchDrag.key, destPath)){
            notify('files', 'File moved', `"${touchDrag.key}" moved.`);
          }
        }
      }
    }
    touchDrag = null;
  }, {passive:false});

  function openFilesApp(startPath){
    let currentPath = startPath || '';
    createWindow({
      appId:'files', title:'Files', icon:'🗂️', width:620, height:420,
      onMount:(body, win)=>{
        body.innerHTML = `
          <div class="fe-wrap">
            <div class="fe-side">
              <div class="fe-side-item" data-p="">${iconSvg('files',15,1.7)} Home</div>
              <div class="fe-side-item" data-p="Documents">${iconSvg('files',15,1.7)} Documents</div>
              <div class="fe-side-item" data-p="Desktop">${iconSvg('files',15,1.7)} Desktop</div>
              <div class="fe-side-item" data-p="Notes">${iconSvg('files',15,1.7)} Notes</div>
            </div>
            <div class="fe-main">
              <div class="fe-crumb" id="fe-crumb"></div>
              <div class="fe-grid" id="fe-grid"></div>
            </div>
          </div>`;
        const side = body.querySelectorAll('.fe-side-item');
        const grid = body.querySelector('#fe-grid');
        const crumb = body.querySelector('#fe-crumb');

        side.forEach(s=>{
          s.addEventListener('dragover', (e)=>{ e.preventDefault(); s.classList.add('drop-hover'); });
          s.addEventListener('dragleave', ()=>s.classList.remove('drop-hover'));
          s.addEventListener('drop', (e)=>{
            e.preventDefault();
            s.classList.remove('drop-hover');
            let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
            if(moveNode(data.from, data.key, s.dataset.p)){
              notify('files', 'File moved', `"${data.key}" moved to ${s.dataset.p || 'Home'}.`);
              render();
            }
          });
        });

        function render(){
          const node = getNode(currentPath) || FS.root;
          crumb.textContent = '/ ' + (currentPath ? currentPath.replace(/\//g,' / ') : 'Home');
          side.forEach(s=>s.classList.toggle('active', s.dataset.p === currentPath));
          grid.innerHTML='';
          const keys = Object.keys(node.children||{});
          if(!keys.length){ grid.innerHTML = '<div class="fe-empty">This folder is empty</div>'; return; }
          keys.forEach(k=>{
            const child = node.children[k];
            const item = document.createElement('div');
            item.className='fe-item';
            item.draggable = true;
            item.dataset.key = k;
            item.dataset.frompath = currentPath;
            item.dataset.type = child.type;
            if(child.type === 'folder') item.dataset.fullpath = currentPath ? currentPath+'/'+k : k;
            item.innerHTML = `<div class="fi">${iconFor(child)}</div><div class="fl">${child.name}</div>`;
            item.addEventListener('dragstart', (e)=>{
              e.dataTransfer.setData('text/plain', JSON.stringify({from: currentPath, key: k}));
              e.dataTransfer.effectAllowed = 'move';
              setTimeout(()=>item.style.opacity='0.35', 0);
            });
            item.addEventListener('dragend', ()=>{ item.style.opacity=''; });
            if(child.type === 'folder'){
              item.addEventListener('dragover', (e)=>{ e.preventDefault(); e.stopPropagation(); item.classList.add('drop-hover'); });
              item.addEventListener('dragleave', ()=>item.classList.remove('drop-hover'));
              item.addEventListener('drop', (e)=>{
                e.preventDefault(); e.stopPropagation();
                item.classList.remove('drop-hover');
                let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
                const destPath = currentPath ? currentPath+'/'+k : k;
                if(moveNode(data.from, data.key, destPath)){
                  notify('files', 'File moved', `"${data.key}" moved into "${child.name}".`);
                  render();
                }
              });
            }
            item.addEventListener('dblclick', ()=>{
              if(child.type==='folder'){
                currentPath = currentPath ? currentPath+'/'+k : k;
                render();
              } else if(child.type==='image'){
                openImageViewerApp(child);
              } else {
                openNotesApp(currentPath ? currentPath+'/'+k : k, child);
              }
            });
            item.addEventListener('contextmenu', (e)=>{
              e.preventDefault(); e.stopPropagation();
              closeCtx();
              ctxEl = document.createElement('div');
              ctxEl.className = 'ctx';
              ctxEl.style.left = e.clientX+'px'; ctxEl.style.top = e.clientY+'px';
              ctxEl.innerHTML = `
                <div class="ctx-item" data-a="rename">${iconSvg('file',15,1.8)} Rename</div>
                <div class="ctx-item" data-a="delete">${iconSvg('trash',15,1.8)} Delete</div>
              `;
              document.body.appendChild(ctxEl);
              ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
                it.addEventListener('click', ()=>{
                  const a = it.dataset.a;
                  closeCtx();
                  if(a==='rename') startRename(item, k, child);
                  if(a==='delete'){
                    const parentNode = getNode(currentPath) || FS.root;
                    delete parentNode.children[k];
                    persistFS();
                    notify('files', 'Deleted', `"${child.name}" was deleted.`);
                    render();
                  }
                });
              });
            });
            grid.appendChild(item);
          });
        }

        function startRename(item, key, child){
          const lbl = item.querySelector('.fl');
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'fe-rename-input';
          input.value = child.name;
          lbl.replaceWith(input);
          input.focus();
          input.select();
          let done = false;
          function commit(){
            if(done) return; done = true;
            const parentNode = getNode(currentPath) || FS.root;
            const newName = input.value.trim();
            if(!newName || newName === key){ render(); return; }
            if(parentNode.children[newName]){ toast(`"${newName}" already exists here`); render(); return; }
            const nodeData = parentNode.children[key];
            nodeData.name = newName;
            delete parentNode.children[key];
            parentNode.children[newName] = nodeData;
            persistFS();
            notify('files', 'Renamed', `"${key}" renamed to "${newName}".`);
            render();
          }
          input.addEventListener('keydown', (e)=>{
            if(e.key==='Enter') commit();
            if(e.key==='Escape'){ done = true; render(); }
          });
          input.addEventListener('blur', commit);
        }

        grid.addEventListener('contextmenu', (e)=>{
          if(e.target.closest('.fe-item')) return;
          e.preventDefault();
          closeCtx();
          ctxEl = document.createElement('div');
          ctxEl.className = 'ctx';
          ctxEl.style.left = e.clientX+'px'; ctxEl.style.top = e.clientY+'px';
          ctxEl.innerHTML = `
            <div class="ctx-item" data-a="newfolder">${iconSvg('files',15,1.8)} New Folder</div>
            <div class="ctx-item" data-a="newfile">${iconSvg('plus',15,1.8)} New Text File</div>
          `;
          document.body.appendChild(ctxEl);
          ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
            it.addEventListener('click', ()=>{
              const a = it.dataset.a;
              closeCtx();
              const node = getNode(currentPath) || FS.root;
              node.children = node.children || {};
              if(a==='newfolder'){
                let name = 'New Folder', i = 1;
                while(node.children[name]){ i++; name = `New Folder ${i}`; }
                node.children[name] = {type:'folder', name, children:{}};
              } else {
                let name = 'New File.txt', i = 1;
                while(node.children[name]){ i++; name = `New File ${i}.txt`; }
                node.children[name] = {type:'file', name, content:''};
              }
              persistFS();
              render();
            });
          });
        });

        side.forEach(s=>s.addEventListener('click', ()=>{ currentPath = s.dataset.p; render(); }));
        function onFsChanged(){ render(); }
        document.addEventListener('fs-changed', onFsChanged);
        win._cleanup = ()=>document.removeEventListener('fs-changed', onFsChanged);
        render();
      }
    });
  }

  /* ============================================================
     APP: TERMINAL
  ============================================================ */
  function openTerminalApp(){
    let cwd = '';
    createWindow({
      appId:'terminal', title:'Terminal', icon:'⌨️', width:560, height:360,
      onMount:(body)=>{
        body.innerHTML = `<div class="term" id="termOut"></div>`;
        const out = body.querySelector('#termOut');

        function promptStr(){ return `guest@aether ${cwd ? '~/'+cwd.replace(/\//g,'/') : '~'} % `; }
        function println(text){
          const div = document.createElement('div');
          div.className='term-line';
          div.textContent = text;
          out.appendChild(div);
          out.scrollTop = out.scrollHeight;
        }
        function printHTML(html){
          const div = document.createElement('div');
          div.className='term-line';
          div.innerHTML = html;
          out.appendChild(div);
          out.scrollTop = out.scrollHeight;
        }
        function newInputLine(){
          const row = document.createElement('div');
          row.className='term-input-row term-line';
          row.innerHTML = `<span class="term-prompt">${promptStr()}</span><input class="term-input" autocapitalize="off" autocomplete="off" spellcheck="false"/>`;
          out.appendChild(row);
          const input = row.querySelector('input');
          input.focus();
          input.addEventListener('keydown',(e)=>{
            if(e.key==='Enter'){
              const val = input.value;
              input.disabled = true;
              runCmd(val.trim());
            }
          });
          out.scrollTop = out.scrollHeight;
        }
        function runCmd(cmdline){
          if(cmdline) println(promptStr()+cmdline);
          const [cmd, ...args] = cmdline.split(/\s+/).filter(Boolean);
          switch(cmd){
            case undefined: break;
            case 'help':
              println('Available commands: ls, cd, cat, pwd, whoami, date, clear, neofetch, echo, mkdir, help');
              break;
            case 'ls': {
              const node = getNode(cwd) || FS.root;
              const keys = Object.keys(node.children||{});
              println(keys.length ? keys.join('   ') : '(empty)');
              break;
            }
            case 'cd': {
              const target = args[0];
              if(!target || target==='~'){ cwd=''; break; }
              if(target==='..'){ const parts=pathParts(cwd); parts.pop(); cwd=parts.join('/'); break; }
              const newPath = cwd ? cwd+'/'+target : target;
              const node = getNode(newPath);
              if(node && node.type==='folder') cwd = newPath;
              else println(`cd: no such directory: ${target}`);
              break;
            }
            case 'pwd':
              println('/' + cwd); break;
            case 'cat': {
              const target = args[0];
              if(!target){ println('usage: cat <file>'); break; }
              const node = getNode(cwd ? cwd+'/'+target : target);
              if(node && node.type==='file') println(node.content);
              else println(`cat: ${target}: No such file`);
              break;
            }
            case 'mkdir': {
              const node = getNode(cwd) || FS.root;
              if(args[0]){
                node.children = node.children||{};
                node.children[args[0]] = {type:'folder', name:args[0], children:{}};
                println(`created folder ${args[0]}`);
                persistFS();
                notify('terminal', 'Folder created', `"${args[0]}" was created in Files.`);
              }
              break;
            }
            case 'echo': println(args.join(' ')); break;
            case 'whoami': println('guest'); break;
            case 'date': println(new Date().toString()); break;
            case 'clear': out.innerHTML=''; newInputLine(); return;
            case 'neofetch':
              printHTML(`<span style="color:#e8935b">Aether OS</span> — web edition<br>Kernel: JavaScript (ES2023)<br>Shell: aetherterm<br>UI: HTML/CSS glass-shell<br>Uptime: ${Math.floor(performance.now()/1000)}s`);
              break;
            case 'sudo': println("Nice try. This isn't that kind of OS."); break;
            default: println(`command not found: ${cmd}`);
          }
          newInputLine();
        }
        println('Aether Terminal — type "help" to see available commands.');
        newInputLine();
        body.addEventListener('click', ()=>{
          const last = out.querySelector('.term-input-row:last-child input');
          if(last && !last.disabled) last.focus();
        });
      }
    });
  }

  function openCalculatorApp(){
    createWindow({
      appId:'calculator', title:'Calculator', icon:'🧮', width:280, height:380,
      onMount:(body)=>{
        body.innerHTML = `
          <div class="calc">
            <div class="calc-screen" id="calcScreen">0</div>
            <div class="calc-grid">
              ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>{
                const isOp = ['÷','×','−','+'].includes(k);
                const isEq = k==='=';
                return `<button class="calc-btn ${isOp?'op':''} ${isEq?'eq':''}" data-k="${k}" style="${k==='0'?'grid-column:span 2':''}">${k}</button>`;
              }).join('')}
            </div>
          </div>`;
        const screen = body.querySelector('#calcScreen');
        let expr = '';
        function render(){ screen.textContent = expr || '0'; }
        body.querySelectorAll('.calc-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const k = btn.dataset.k;
            if(k==='C'){ expr=''; }
            else if(k==='⌫'){ expr = expr.slice(0,-1); }
            else if(k==='='){
              try{
                const safe = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
                if(!/^[0-9+\-*/.() ]+$/.test(safe)) throw 0;
                // eslint-disable-next-line no-eval
                const result = Function('"use strict";return ('+safe+')')();
                expr = String(Math.round(result*1e8)/1e8);
              }catch(e){ expr='Error'; }
            } else if(k==='±'){
              expr = expr.startsWith('-') ? expr.slice(1) : '-'+expr;
            } else {
              expr += k;
            }
            render();
          });
        });
        render();
      }
    });
  }

  function openBrowserApp(){
    const bookmarks = [
      {title:'Wikipedia', url:'https://en.wikipedia.org/wiki/Special:Random'},
      {title:'Example', url:'https://example.com'},
      {title:'MDN', url:'https://developer.mozilla.org'},
    ];
    let history = [];
    let histIdx = -1;
    createWindow({
      appId:'browser', title:'Browser', icon:'🧭', width:640, height:460,
      onMount:(body)=>{
        body.style.display='flex'; body.style.flexDirection='column';
        body.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(var(--tint-rgb),0.06);background:rgba(var(--tint-rgb),0.02);">
            <span id="brBack" style="cursor:pointer;opacity:.4;user-select:none;">←</span>
            <span id="brFwd" style="cursor:pointer;opacity:.4;user-select:none;">→</span>
            <span id="brReload" style="cursor:pointer;opacity:.7;user-select:none;">⟳</span>
            <input id="brInput" type="text" placeholder="Enter a URL (search opens in a new tab)" style="flex:1;background:rgba(var(--tint-rgb),0.06);border:1px solid var(--glass-border);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--font-mono);color:var(--text-primary);outline:none;">
            <span id="brOpenNew" title="Open in new browser tab" style="cursor:pointer;opacity:.7;">↗</span>
          </div>
          <div id="brProgress" style="height:2px;background:var(--accent);width:0%;transition:width .3s ease;"></div>
          <div id="brBody" style="flex:1;position:relative;overflow:hidden;">
            <iframe id="brFrame" style="width:100%;height:100%;border:none;background:#fff;"></iframe>
          </div>
          <div style="display:flex;gap:6px;padding:6px 10px;border-top:1px solid rgba(var(--tint-rgb),0.06);flex-wrap:wrap;">
            ${bookmarks.map(b=>`<div class="fe-side-item" data-u="${b.url}" style="cursor:pointer;">${b.title}</div>`).join('')}
          </div>`;
        const frame = body.querySelector('#brFrame');
        const input = body.querySelector('#brInput');
        const progress = body.querySelector('#brProgress');
        const backBtn = body.querySelector('#brBack');
        const fwdBtn = body.querySelector('#brFwd');

        function isDirectUrl(v){
          return /^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v);
        }
        function normalizeUrl(raw){
          const v = raw.trim();
          if(!v) return null;
          if(/^https?:\/\//i.test(v)) return v;
          return 'https://' + v;
        }
        function updateNavButtons(){
          backBtn.style.opacity = histIdx > 0 ? '.85' : '.35';
          fwdBtn.style.opacity = histIdx < history.length - 1 ? '.85' : '.35';
        }
        function loadUrl(url, pushHistory){
          if(!isOnline()){
            frame.srcdoc = `<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:sans-serif;background:#111;color:#888;"><div style="font-size:14px;">No internet connection</div><div style="font-size:12px;">Check Wi-Fi in Quick Settings</div></body>`;
            input.value = url;
            toast('No internet connection — check Wi-Fi');
            return;
          }
          progress.style.width = '25%';
          frame.removeAttribute('srcdoc');
          frame.src = url;
          input.value = url;
          if(pushHistory !== false){
            history = history.slice(0, histIdx + 1);
            history.push(url);
            histIdx = history.length - 1;
          }
          updateNavButtons();
        }
        frame.addEventListener('load', ()=>{
          progress.style.width = '100%';
          setTimeout(()=>{ progress.style.width = '0%'; }, 300);
        });
        input.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){
            const raw = input.value.trim();
            if(!raw) return;
            if(isDirectUrl(raw)){
              loadUrl(normalizeUrl(raw));
            } else {
              // most search engines block iframe embedding entirely —
              // opening a real new tab avoids a guaranteed "refused to connect"
              window.open('https://duckduckgo.com/?q=' + encodeURIComponent(raw), '_blank', 'noopener');
              toast('Search opened in a new tab (search engines block embedding)');
            }
          }
        });
        body.querySelector('#brReload').addEventListener('click', ()=>{
          if(history[histIdx]) loadUrl(history[histIdx], false);
        });
        backBtn.addEventListener('click', ()=>{
          if(histIdx > 0){ histIdx--; loadUrl(history[histIdx], false); }
        });
        fwdBtn.addEventListener('click', ()=>{
          if(histIdx < history.length - 1){ histIdx++; loadUrl(history[histIdx], false); }
        });
        body.querySelector('#brOpenNew').addEventListener('click', ()=>{
          const url = history[histIdx] || normalizeUrl(input.value);
          if(url) window.open(url, '_blank', 'noopener');
        });
        body.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click', ()=>loadUrl(b.dataset.u)));

        loadUrl('https://example.com');
      }
    });
  }

  /* ============================================================
     APP: PERFORMANCE HUB — Omen-style perf modes, live stats, fan & lighting
  ============================================================ */
  function openPerformanceApp(){
    const MODES = ['eco','balanced','performance','turbo'];
    const MODE_LABELS = {eco:'Eco', balanced:'Balanced', performance:'Performance', turbo:'Turbo'};
    const MODE_RANGES = {
      eco:         {cpu:[8,25],  gpu:[4,15],  temp:[36,48], clock:[1.6,2.4], fps:[28,42]},
      balanced:    {cpu:[22,48], gpu:[18,42], temp:[46,60], clock:[2.4,3.1], fps:[42,72]},
      performance: {cpu:[48,78], gpu:[42,74], temp:[60,76], clock:[3.1,3.9], fps:[70,115]},
      turbo:       {cpu:[74,97], gpu:[74,98], temp:[74,89], clock:[3.9,4.7], fps:[112,160]},
    };
    let mode = MODES.includes(appState.perfMode) ? appState.perfMode : 'balanced';
    let boosting = false;
    let fanAuto = true;
    let fanManual = 50;
    let stats = {cpu:30, gpu:25, temp:50, clock:2.6, fps:55};
    let tickTimer = null;

    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function stepToward(range, prev){
      const [lo,hi] = range;
      const delta = (Math.random()-0.5) * (hi-lo) * 0.18;
      return clamp(prev + delta, lo, hi);
    }

    createWindow({
      appId:'performance', title:'Performance Hub', icon:'performance', width:400, height:600,
      onMount:(body, win)=>{
        body.innerHTML = `<div class="app-pad" style="display:flex;flex-direction:column;gap:18px;">
          <div>
            <h3 class="section-h">Performance Mode</h3>
            <div class="perf-modes" id="perfModes">
              ${MODES.map(m=>`<button class="perf-mode-btn" data-m="${m}">${MODE_LABELS[m]}</button>`).join('')}
            </div>
          </div>
          <div>
            <h3 class="section-h">Live Stats</h3>
            <div class="perf-stats-grid" id="perfStatsGrid">
              <div class="perf-stat-card"><div class="perf-stat-label">CPU Load</div><div class="perf-stat-value" id="pCpuVal">--%</div><div class="perf-stat-bar"><div class="perf-stat-bar-fill" id="pCpuBar" style="width:0%"></div></div></div>
              <div class="perf-stat-card"><div class="perf-stat-label">GPU Load</div><div class="perf-stat-value" id="pGpuVal">--%</div><div class="perf-stat-bar"><div class="perf-stat-bar-fill" id="pGpuBar" style="width:0%"></div></div></div>
              <div class="perf-stat-card"><div class="perf-stat-label">Temperature</div><div class="perf-stat-value" id="pTempVal">--°C</div><div class="perf-stat-bar"><div class="perf-stat-bar-fill" id="pTempBar" style="width:0%"></div></div></div>
              <div class="perf-stat-card"><div class="perf-stat-label">Clock Speed</div><div class="perf-stat-value" id="pClockVal">--GHz</div><div class="perf-stat-bar"><div class="perf-stat-bar-fill" id="pClockBar" style="width:0%"></div></div></div>
              <div class="perf-stat-card" style="grid-column:span 2;"><div class="perf-stat-label">Frame Rate</div><div class="perf-stat-value" id="pFpsVal">-- fps</div><div class="perf-stat-bar"><div class="perf-stat-bar-fill" id="pFpsBar" style="width:0%"></div></div></div>
            </div>
          </div>
          <div>
            <h3 class="section-h">Cooling</h3>
            <div class="settings-row" style="border-bottom:none;padding-bottom:6px;">
              <div><div class="settings-label">Auto fan curve</div><div class="settings-sub" id="pFanRpm">-- RPM</div></div>
              <div class="toggle on" id="fanAutoToggle"><div class="toggle-knob"></div></div>
            </div>
            <div class="perf-fan-row" id="fanManualRow" style="display:none;">
              <input type="range" min="0" max="100" value="50" id="fanSlider">
              <span id="fanPct" style="font-size:12px;color:var(--text-muted);width:36px;text-align:right;">50%</span>
            </div>
          </div>
          <div>
            <h3 class="section-h">Lighting</h3>
            <div class="perf-light-swatches" id="perfSwatches"></div>
          </div>
          <button class="perf-boost-btn" id="boostBtn">⚡ Boost</button>
        </div>`;

        const modeButtons = body.querySelectorAll('.perf-mode-btn');
        function setActiveModeBtn(){ modeButtons.forEach(b=>b.classList.toggle('active', b.dataset.m===mode)); }
        modeButtons.forEach(b=>{
          b.addEventListener('click', ()=>{
            mode = b.dataset.m;
            appState.perfMode = mode;
            persistState();
            setActiveModeBtn();
            notify('performance', 'Mode changed', `Switched to ${MODE_LABELS[mode]} mode.`);
            if(mode === 'eco' && !appState.motion){
              appState.motion = true;
              document.body.style.setProperty('--motion', '0');
              persistState();
              toast('Eco mode also reduced motion for you');
            }
          });
        });
        setActiveModeBtn();

        const cpuVal = body.querySelector('#pCpuVal'), cpuBar = body.querySelector('#pCpuBar');
        const gpuVal = body.querySelector('#pGpuVal'), gpuBar = body.querySelector('#pGpuBar');
        const tempVal = body.querySelector('#pTempVal'), tempBar = body.querySelector('#pTempBar');
        const clockVal = body.querySelector('#pClockVal'), clockBar = body.querySelector('#pClockBar');
        const fpsVal = body.querySelector('#pFpsVal'), fpsBar = body.querySelector('#pFpsBar');
        const fanRpmLabel = body.querySelector('#pFanRpm');

        function render(){
          cpuVal.textContent = Math.round(stats.cpu)+'%';
          cpuBar.style.width = clamp(stats.cpu,0,100)+'%';
          gpuVal.textContent = Math.round(stats.gpu)+'%';
          gpuBar.style.width = clamp(stats.gpu,0,100)+'%';
          tempVal.textContent = Math.round(stats.temp)+'°C';
          tempBar.style.width = clamp((stats.temp-30)/(95-30)*100,0,100)+'%';
          clockVal.textContent = stats.clock.toFixed(1)+'GHz';
          clockBar.style.width = clamp((stats.clock-1.2)/(5.0-1.2)*100,0,100)+'%';
          fpsVal.textContent = Math.round(stats.fps)+' fps';
          fpsBar.style.width = clamp(stats.fps/165*100,0,100)+'%';
          const rpm = fanAuto ? Math.round(800 + (stats.temp-36)*38) : Math.round(fanManual/100*4200);
          fanRpmLabel.textContent = Math.max(0,rpm)+' RPM';
        }
        function tick(){
          const r = boosting ? MODE_RANGES.turbo : MODE_RANGES[mode];
          stats.cpu = stepToward(r.cpu, stats.cpu);
          stats.gpu = stepToward(r.gpu, stats.gpu);
          stats.temp = stepToward(r.temp, stats.temp);
          stats.clock = stepToward(r.clock, stats.clock);
          stats.fps = stepToward(r.fps, stats.fps);
          render();
        }
        tickTimer = setInterval(tick, 1000);
        tick();

        const fanAutoToggle = body.querySelector('#fanAutoToggle');
        const fanManualRow = body.querySelector('#fanManualRow');
        const fanSlider = body.querySelector('#fanSlider');
        const fanPct = body.querySelector('#fanPct');
        fanAutoToggle.addEventListener('click', ()=>{
          fanAuto = !fanAuto;
          fanAutoToggle.classList.toggle('on', fanAuto);
          fanManualRow.style.display = fanAuto ? 'none' : 'flex';
        });
        fanSlider.addEventListener('input', ()=>{
          fanManual = Number(fanSlider.value);
          fanPct.textContent = fanManual+'%';
        });

        const swatchWrap = body.querySelector('#perfSwatches');
        Object.entries(ACCENTS).forEach(([name,hex])=>{
          const d = document.createElement('div');
          d.className = 'swatch'+(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()===hex?' active':'');
          d.style.background = hex;
          d.addEventListener('click', ()=>{
            applyAccent(hex);
            swatchWrap.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
            d.classList.add('active');
            toast('Lighting color updated');
          });
          swatchWrap.appendChild(d);
        });

        body.querySelector('#boostBtn').addEventListener('click', (e)=>{
          if(boosting) return;
          boosting = true;
          const btn = e.currentTarget;
          btn.disabled = true;
          btn.textContent = '⚡ Boosting…';
          body.querySelector('#perfStatsGrid').classList.add('boosting');
          notify('performance', 'Boost activated', 'Temporary performance boost engaged for 4 seconds.');
          setTimeout(()=>{
            boosting = false;
            btn.disabled = false;
            btn.textContent = '⚡ Boost';
            body.querySelector('#perfStatsGrid').classList.remove('boosting');
          }, 4000);
        });

        win._cleanup = ()=>clearInterval(tickTimer);
      }
    });
  }

  function openNovaDashApp(){
    const MODE_LABELS_G = {eco:'Eco', balanced:'Balanced', performance:'Performance', turbo:'Turbo'};
    const DIFFICULTY = {
      eco:         {spawnMs:900, speed:2.2, trail:0},

        let running = false, raf = null;

          cancelAnimationFrame(raf);
          const m = DIFFICULTY[appState.perfMode] ? appState.perfMode : 'balanced';
          overlay.innerHTML = `<h2>Crashed!</h2><p>You scored ${score} points in ${MODE_LABELS_G[m]} mode.</p><button class="game-btn" id="ndStart">Play Again</button>`;
          overlay.style.display = 'flex';
          overlay.querySelector('#ndStart').addEventListener('click', startGame);
          notify('novadash', 'Game Over', `Scored ${score} points in ${MODE_LABELS_G[m]} mode.`);
        }
        function startGame(){
          overlay.style.display = 'none';
          reset();
          running = true;
          lastFrame = performance.now();
          raf = requestAnimationFrame(loop);
        }
        function loop(now){
          if(!running) return;
          const dt = now - lastFrame;
          lastFrame = now;
          fpsAcc += dt; fpsCount++;
          if(fpsAcc > 500){ fpsLabel.textContent = 'FPS: '+Math.round(1000/(fpsAcc/fpsCount)); fpsAcc=0; fpsCount=0; }

          const diff = currentDifficulty();
          if(keys.ArrowLeft) playerX -= 5.5;
          if(keys.ArrowRight) playerX += 5.5;
          playerX = Math.max(14, Math.min(canvas.width-14, playerX));

          lastSpawn += dt;
          if(lastSpawn > diff.spawnMs){
            lastSpawn = 0;
            obstacles.push({x: Math.random()*canvas.width, y:-10, r: 8+Math.random()*10});
          }
          const playerY = canvas.height - 34;
          for(let i=obstacles.length-1;i>=0;i--){
            const o = obstacles[i];
            o.y += diff.speed + score*0.002;
            if(o.y > canvas.height+20){ obstacles.splice(i,1); score++; scoreLabel.textContent='Score: '+score; continue; }
            const dx = o.x-playerX, dy = o.y-playerY;
            if(Math.sqrt(dx*dx+dy*dy) < o.r+10){ obstacles.splice(i,1); gameOver(); return; }
          }
          if(diff.trail > 0 && Math.random() < diff.trail/16){
            particles.push({x:playerX+(Math.random()-0.5)*10, y:playerY+10, life:1});
          }
          for(let i=particles.length-1;i>=0;i--){
            particles[i].life -= 0.04; particles[i].y += 1.2;
            if(particles[i].life<=0) particles.splice(i,1);
          }

          const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e8935b';
          ctx.fillStyle = '#05060a';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          particles.forEach(p=>{
            ctx.globalAlpha = p.life*0.6;
            ctx.fillStyle = accentColor;
            ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
          });
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#7fe3d6';
          obstacles.forEach(o=>{ ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); });
          ctx.fillStyle = accentColor;
          ctx.beginPath();
          ctx.moveTo(playerX, playerY-12);
          ctx.lineTo(playerX-11, playerY+10);
          ctx.lineTo(playerX+11, playerY+10);
          ctx.closePath(); ctx.fill();

          raf = requestAnimationFrame(loop);
        }

        function onKeyDown(e){ keys[e.key]=true; }
        function onKeyUp(e){ keys[e.key]=false; }
        function pointerToX(clientX){
          const rect = canvas.getBoundingClientRect();
          return clientX - rect.left;
        }
        function onCanvasMove(e){
          if(!running) return;
          if(e.touches && e.touches[0]) playerX = pointerToX(e.touches[0].clientX);
        }
        function onCanvasMouseMove(e){
          if(!running || e.buttons !== 1) return;
          playerX = pointerToX(e.clientX);
        }
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        canvas.addEventListener('touchmove', onCanvasMove, {passive:true});
        canvas.addEventListener('mousemove', onCanvasMouseMove);
        body.querySelector('#ndStart').addEventListener('click', startGame);
        resize();

        win._cleanup = ()=>{
          running = false;
          cancelAnimationFrame(raf);
          document.removeEventListener('keydown', onKeyDown);
          document.removeEventListener('keyup', onKeyUp);
        };
      }
    });
  }

  /* ============================================================
     GAME: REFLEX TAP — tap the lit tile before it expires;
     grid size and speed follow the current Performance Hub mode
  ============================================================ */
  function openReflexTapApp(){
    const MODE_LABELS_G = {eco:'Eco', balanced:'Balanced', performance:'Performance', turbo:'Turbo'};
    const RT_DIFFICULTY = {
      eco:         {grid:3, duration:1100, burst:4},
      balanced:    {grid:4, duration:850,  burst:8},
      performance: {grid:4, duration:600,  burst:12},
      turbo:       {grid:5, duration:420,  burst:20},
    };
    createWindow({
      appId:'reflextap', title:'Reflex Tap', icon:'reflextap', width:360, height:460,
      onMount:(body, win)=>{
        body.style.position = 'relative';
        body.innerHTML = `<div class="game-wrap">
          <div class="game-hud">
            <span id="rtMode">Mode: Balanced</span>
            <span id="rtLives">Lives: 3</span>
            <span id="rtScore">Score: 0</span>
          </div>
          <div class="rt-grid" id="rtGrid"></div>
        </div>
        <div class="game-overlay" id="rtOverlay">
          <h2>Reflex Tap</h2>
          <p>Tap the glowing tile before it fades. Grid size and speed follow your current Performance Hub mode.</p>
          <button class="game-btn" id="rtStart">Start</button>
        </div>`;

        const gridEl = body.querySelector('#rtGrid');
        const modeLabel = body.querySelector('#rtMode');
        const livesLabel = body.querySelector('#rtLives');
        const scoreLabel = body.querySelector('#rtScore');
        const overlay = body.querySelector('#rtOverlay');

        let running = false, lives = 3, score = 0, litIndex = -1, litTimer = null, tiles = [];

        function currentDiff(){
          const m = RT_DIFFICULTY[appState.perfMode] ? appState.perfMode : 'balanced';
          modeLabel.textContent = 'Mode: ' + MODE_LABELS_G[m];
          return RT_DIFFICULTY[m];
        }
        function burst(x, y, count){
          const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e8935b';
          for(let i=0;i<count;i++){
            const p = document.createElement('div');
            p.className = 'rt-burst';
            p.style.left = x+'px'; p.style.top = y+'px';
            p.style.background = accentColor;
            body.appendChild(p);
            const angle = Math.random()*Math.PI*2;
            const dist = 20 + Math.random()*30;
            p.animate([
              {transform:'translate(0,0)', opacity:1},
              {transform:`translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity:0}
            ], {duration:450, easing:'ease-out'});
            setTimeout(()=>p.remove(), 460);
          }
        }
        function buildGrid(n){
          gridEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
          gridEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;
          gridEl.innerHTML = '';
          tiles = [];
          for(let i=0;i<n*n;i++){
            const t = document.createElement('div');
            t.className = 'rt-tile';
            t.addEventListener('click', ()=>handleTap(i));
            gridEl.appendChild(t);
            tiles.push(t);
          }
        }
        function lightRandomTile(){
          const diff = currentDiff();
          if(tiles.length !== diff.grid*diff.grid) buildGrid(diff.grid);
          tiles.forEach(t=>t.classList.remove('lit','wrong'));
          litIndex = Math.floor(Math.random()*tiles.length);
          tiles[litIndex].classList.add('lit');
          clearTimeout(litTimer);
          litTimer = setTimeout(()=>{
            tiles[litIndex].classList.remove('lit');
            loseLife();
          }, diff.duration);
        }
        function loseLife(){
          lives--;
          livesLabel.textContent = 'Lives: '+lives;
          if(lives <= 0){ endGame(); return; }
          lightRandomTile();
        }
        function handleTap(i){
          if(!running) return;
          if(i === litIndex){
            score++;
            scoreLabel.textContent = 'Score: '+score;
            const rect = tiles[i].getBoundingClientRect();
            const bodyRect = body.getBoundingClientRect();
            burst(rect.left-bodyRect.left+rect.width/2, rect.top-bodyRect.top+rect.height/2, currentDiff().burst);
            clearTimeout(litTimer);
            lightRandomTile();
          } else {
            tiles[i].classList.add('wrong');
            setTimeout(()=>tiles[i].classList.remove('wrong'), 200);
            clearTimeout(litTimer);
            loseLife();
          }
        }
        function endGame(){
          running = false;
          clearTimeout(litTimer);
          tiles.forEach(t=>t.classList.remove('lit'));
          const m = RT_DIFFICULTY[appState.perfMode] ? appState.perfMode : 'balanced';
          overlay.innerHTML = `<h2>Out of lives</h2><p>You scored ${score} points in ${MODE_LABELS_G[m]} mode.</p><button class="game-btn" id="rtStart">Play Again</button>`;
          overlay.style.display = 'flex';
          overlay.querySelector('#rtStart').addEventListener('click', startGame);
          notify('reflextap', 'Game Over', `Scored ${score} points in ${MODE_LABELS_G[m]} mode.`);
        }
        function startGame(){
          overlay.style.display = 'none';
          lives = 3; score = 0;
          livesLabel.textContent = 'Lives: 3';
          scoreLabel.textContent = 'Score: 0';
          running = true;
          buildGrid(currentDiff().grid);
          lightRandomTile();
        }
        body.querySelector('#rtStart').addEventListener('click', startGame);

        win._cleanup = ()=>{ running = false; clearTimeout(litTimer); };
      }
    });
  }

  /* ============================================================
     APP: PAINT — canvas drawing tool that saves into Files
  ============================================================ */
  function openPaintApp(){
    const COLORS = ['#e8935b','#7fe3d6','#a78bfa','#f0708f','#b9e86b','#f1ede7','#221f1c','#e8615b'];
    createWindow({
      appId:'paint', title:'Paint', icon:'paint', width:460, height:520,
      onMount:(body, win)=>{
        body.style.position = 'relative';
        body.innerHTML = `<div class="paint-wrap">
          <div class="paint-toolbar">
            <div class="paint-swatches" id="paintSwatches"></div>
            <input type="color" id="paintCustomColor" value="#e8935b" style="width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0;">
            <input type="range" min="1" max="40" value="5" id="paintSize" style="width:70px;accent-color:var(--accent);">
            <button class="paint-tool-btn" id="paintEraser" title="Eraser">${iconSvg('trash',15,1.7)}</button>
            <button class="paint-tool-btn" id="paintUndo" title="Undo">${iconSvg('refresh',15,1.7)}</button>
            <button class="paint-tool-btn" id="paintClear" title="Clear">✕</button>
            <button class="paint-tool-btn" id="paintSave" title="Save to Files" style="width:auto;padding:0 10px;font-size:11.5px;">Save</button>
            <button class="paint-tool-btn" id="paintDownload" title="Download PNG" style="width:auto;padding:0 10px;font-size:11.5px;">↓</button>
          </div>
          <div class="paint-canvas-wrap" id="paintCanvasWrap">
            <canvas id="paintCanvas"></canvas>
          </div>
          <div class="paint-save-overlay" id="paintSaveOverlay">
            <div class="paint-save-card">
              <div style="font-size:13px;font-weight:600;">Save drawing</div>
              <input type="text" id="paintFileName" placeholder="Untitled" autocomplete="off">
              <div style="display:flex;gap:8px;justify-content:center;">
                <button class="setup-btn ghost" id="paintSaveCancel" style="color:var(--text-primary);border-color:var(--glass-border);">Cancel</button>
                <button class="setup-btn primary" id="paintSaveConfirm" style="background:var(--accent);color:#1a1006;">Save</button>
              </div>
            </div>
          </div>
        </div>`;

        const wrap = body.querySelector('#paintCanvasWrap');
        const canvas = body.querySelector('#paintCanvas');
        const ctx = canvas.getContext('2d');
        let color = COLORS[0];
        let size = 5;
        let erasing = false;
        let drawing = false;
        let lastX = 0, lastY = 0;
        let undoStack = [];

        function resizeCanvas(){
          const prev = canvas.width ? canvas.toDataURL() : null;
          canvas.width = wrap.clientWidth;
          canvas.height = wrap.clientHeight;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          if(prev){
            const img = new Image();
            img.onload = ()=>ctx.drawImage(img,0,0);
            img.src = prev;
          }
        }
        resizeCanvas();

        const swatchWrap = body.querySelector('#paintSwatches');
        COLORS.forEach((hex,i)=>{
          const d = document.createElement('div');
          d.className = 'paint-swatch'+(i===0?' active':'');
          d.style.background = hex;
          d.addEventListener('click', ()=>{
            color = hex; erasing = false;
            swatchWrap.querySelectorAll('.paint-swatch').forEach(s=>s.classList.remove('active'));
            d.classList.add('active');
            body.querySelector('#paintEraser').classList.remove('active');
          });
          swatchWrap.appendChild(d);
        });
        body.querySelector('#paintCustomColor').addEventListener('input', (e)=>{
          color = e.target.value; erasing = false;
          swatchWrap.querySelectorAll('.paint-swatch').forEach(s=>s.classList.remove('active'));
          body.querySelector('#paintEraser').classList.remove('active');
        });
        body.querySelector('#paintSize').addEventListener('input', (e)=>{ size = Number(e.target.value); });

        const eraserBtn = body.querySelector('#paintEraser');
        eraserBtn.addEventListener('click', ()=>{
          erasing = !erasing;
          eraserBtn.classList.toggle('active', erasing);
        });

        function pos(e){
          const rect = canvas.getBoundingClientRect();
          return {x: e.clientX-rect.left, y: e.clientY-rect.top};
        }
        function pushUndo(){
          undoStack.push(canvas.toDataURL());
          if(undoStack.length > 15) undoStack.shift();
        }
        canvas.addEventListener('pointerdown', (e)=>{
          pushUndo();
          drawing = true;
          const p = pos(e);
          lastX = p.x; lastY = p.y;
          ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(p.x,p.y,size/2,0,Math.PI*2); ctx.fill();
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', (e)=>{
          if(!drawing) return;
          const p = pos(e);
          ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
          ctx.strokeStyle = color;
          ctx.lineWidth = size;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(lastX,lastY);
          ctx.lineTo(p.x,p.y);
          ctx.stroke();
          lastX = p.x; lastY = p.y;
        });
        canvas.addEventListener('pointerup', ()=>{ drawing = false; });
        canvas.addEventListener('pointerleave', ()=>{ drawing = false; });

        body.querySelector('#paintUndo').addEventListener('click', ()=>{
          if(!undoStack.length) return;
          const data = undoStack.pop();
          const img = new Image();
          img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
          img.src = data;
        });
        body.querySelector('#paintClear').addEventListener('click', ()=>{
          pushUndo();
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,canvas.width,canvas.height);
        });

        const saveOverlay = body.querySelector('#paintSaveOverlay');
        body.querySelector('#paintSave').addEventListener('click', ()=>{
          saveOverlay.style.display = 'flex';
          body.querySelector('#paintFileName').focus();
        });
        body.querySelector('#paintSaveCancel').addEventListener('click', ()=>{ saveOverlay.style.display = 'none'; });
        body.querySelector('#paintSaveConfirm').addEventListener('click', ()=>{
          const nameInput = body.querySelector('#paintFileName');
          let name = (nameInput.value.trim() || 'Untitled') + '.png';
          const desktop = getNode('Desktop') || FS.root;
          desktop.children = desktop.children || {};
          let finalName = name, i = 1;
          while(desktop.children[finalName]){ i++; finalName = name.replace('.png', ` ${i}.png`); }
          desktop.children[finalName] = {type:'image', name:finalName, content: canvas.toDataURL('image/png')};
          persistFS();
          document.dispatchEvent(new CustomEvent('fs-changed'));
          notify('paint', 'Drawing saved', `"${finalName}" was saved to Desktop.`);
          saveOverlay.style.display = 'none';
          nameInput.value = '';
        });

        body.querySelector('#paintDownload').addEventListener('click', ()=>{
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'aether-drawing.png';
          a.click();
          toast('Drawing downloaded');
        });

        let resizeTimer = null;
        const ro = new ResizeObserver(()=>{
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resizeCanvas, 120);
        });
        ro.observe(wrap);
        win._cleanup = ()=>ro.disconnect();
      }
    });
  }

     LAUNCHER (START MENU)

    {id:'files', name:'Files'},
    {id:'notes', name:'Notes'},
    {id:'terminal', name:'Terminal'},
    {id:'browser', name:'Browser'},
    {id:'music', name:'Music'},
    {id:'photos', name:'Photos'},
    {id:'paint', name:'Paint'},
    {id:'calculator', name:'Calculator'},
    {id:'performance', name:'Performance Hub'},
    {id:'novadash', name:'Nova Dash'},
    {id:'reflextap', name:'Reflex Tap'},
    {id:'taskmanager', name:'Task Manager'},
    {id:'settings', name:'Settings'},
    {id:'lock', name:'Lock Screen'},
    {id:'trash', name:'Trash'},
  ];
  const launcher = document.getElementById('launcher');
  const launcherSearch = document.getElementById('launcherSearch');
  const launcherGrid = document.getElementById('launcherGrid');
  const launcherEmpty = document.getElementById('launcherEmpty');
  let kbdIndex = 0;

  function renderLauncher(filter){
    const q = (filter||'').trim().toLowerCase();
    const items = APP_META.filter(a => a.name.toLowerCase().includes(q));
    launcherGrid.innerHTML = '';
    launcherEmpty.style.display = items.length ? 'none' : 'block';
    kbdIndex = 0;
    items.forEach((a, i)=>{
      const el = document.createElement('div');
      el.className = 'launcher-item'+(i===0?' kbd-sel':'');
      el.dataset.app = a.id;
      el.innerHTML = `<div class="li-icn">${iconSvg(a.id, 26, 1.6)}</div><div class="li-lbl">${a.name}</div>`;
      el.addEventListener('click', ()=>launchFromLauncher(a.id));
      launcherGrid.appendChild(el);
    });
  }
  function launchFromLauncher(appId){
    closeLauncher();
    if(appId==='trash'){ toast('Trash is empty'); return; }
    if(appId==='lock'){ relock(); return; }
    launchApp(appId);
  }
  function openLauncher(){
    launcherSearch.value = '';
    renderLauncher('');
    launcher.classList.add('open');
    setTimeout(()=>launcherSearch.focus(), 60);
  }
  function closeLauncher(){ launcher.classList.remove('open'); }
  function toggleLauncher(){ launcher.classList.contains('open') ? closeLauncher() : openLauncher(); }

  document.getElementById('mbLogo').addEventListener('click', (e)=>{ e.stopPropagation(); toggleLauncher(); });
  document.getElementById('dockStart').addEventListener('click', (e)=>{ e.stopPropagation(); toggleLauncher(); });
  document.getElementById('dockStart').addEventListener('contextmenu', (e)=>{

  document.getElementById('launcherPower').addEventListener('click', (e)=>{

      if(a==='shutdown') doShutdown();

    if(!e.target.closest('#powerMenu') && !e.target.closest('#launcherPower')) powerMenu.classList.remove('open');
  });

  launcherSearch.addEventListener('input', ()=>renderLauncher(launcherSearch.value));
  launcher.addEventListener('mousedown', (e)=>{ if(e.target===launcher) closeLauncher(); });
  launcherSearch.addEventListener('keydown', (e)=>{
    const items = Array.from(launcherGrid.querySelectorAll('.launcher-item'));
    if(!items.length) return;
    if(e.key==='ArrowRight' || e.key==='ArrowDown'){
      e.preventDefault();
      items[kbdIndex].classList.remove('kbd-sel');
      kbdIndex = Math.min(items.length-1, kbdIndex+1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){

      kbdIndex = Math.max(0, kbdIndex-1);
      items[kbdIndex].classList.add('kbd-sel');
      items[kbdIndex].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      launchFromLauncher(items[kbdIndex].dataset.app);

    ctxEl = document.createElement('div');
    ctxEl.className='ctx';
    ctxEl.style.left = e.clientX+'px';
    ctxEl.style.top = e.clientY+'px';
    ctxEl.innerHTML = `
      <div class="ctx-item" data-a="new">${iconSvg('plus',15,1.8)} New Text File</div>
      <div class="ctx-item" data-a="files">${iconSvg('files',15,1.8)} Open Files</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-a="settings">${iconSvg('settings',15,1.8)} Settings</div>
      <div class="ctx-item" data-a="about">${iconSvg('info',15,1.8)} About Aether</div>
    `;
    document.body.appendChild(ctxEl);
    ctxEl.querySelectorAll('.ctx-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        const a = it.dataset.a;
        if(a==='new') openNotesApp(null,null);
        if(a==='files') openFilesApp('');
        if(a==='settings') openSettingsApp();
        if(a==='about') openSettingsApp();
      });
    });
  });

  /* ============================================================
     DESKTOP ICON SELECTION
  ============================================================ */
  document.querySelectorAll('.dicon').forEach(ic=>{
    ic.addEventListener('click',(e)=>{
      e.stopPropagation();
      document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel'));
      ic.classList.add('sel');
    });
  });
  desktop.addEventListener('click', ()=>document.querySelectorAll('.dicon').forEach(i=>i.classList.remove('sel')));

  /* ============================================================
     TRASH — drop a file/folder here to delete it for real
  ============================================================ */
  const trashIcon = document.querySelector('.dicon[data-app="trash"]');
  if(trashIcon){
    trashIcon.addEventListener('dragover', (e)=>{ e.preventDefault(); trashIcon.classList.add('drop-hover'); });
    trashIcon.addEventListener('dragleave', ()=>trashIcon.classList.remove('drop-hover'));
    trashIcon.addEventListener('drop', (e)=>{
      e.preventDefault();
      trashIcon.classList.remove('drop-hover');
      let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      const fromNode = getNode(data.from) || FS.root;
      if(fromNode.children && fromNode.children[data.key]){
        delete fromNode.children[data.key];
        persistFS();
        notify('trash', 'Moved to Trash', `"${data.key}" was deleted.`);
      }
    });
  }

})();
</script>
</body>
</html>
