<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether — a web OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0c11;
    --bg-elevated:#14171f;
    --tint-rgb: 255,255,255;
    --panel-rgb: 20,23,31;
    --glass: rgba(var(--tint-rgb),0.055);
    --glass-strong: rgba(var(--tint-rgb),0.09);
    --glass-border: rgba(var(--tint-rgb),0.12);
    --accent:#e8935b;
    --accent-soft: rgba(232,147,91,0.32);
    --cool:#7fe3d6;
    --text-primary:#f1ede7;
    --text-muted:#9a9ca6;
    --text-dim:#666a76;
    --danger:#e8615b;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Outfit',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  body.theme-light{
    --bg-void:#eeeae2;
    --bg-elevated:#ffffff;
    --tint-rgb: 0,0,0;
    --panel-rgb: 255,253,249;
    --glass: rgba(0,0,0,0.045);
    --glass-strong: rgba(0,0,0,0.075);
    --glass-border: rgba(0,0,0,0.1);
    --text-primary:#221f1c;
    --text-muted:#6b665e;
    --text-dim:#9b968c;
  }
  body.theme-light #desktop[data-wallpaper="aurora"],
  body.theme-light #desktop:not([data-wallpaper]){
    background:
      radial-gradient(circle at 15% 20%, rgba(232,147,91,0.20), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(127,227,214,0.20), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(120,110,220,0.14), transparent 50%),
      linear-gradient(160deg, #f4f0e8 0%, #eeeae2 60%, #f1ede4 100%);
  }
  body.theme-light .win-title{ background:rgba(0,0,0,0.02); }
  body.theme-light .lock-hint, body.theme-light .boot-word{ color:rgba(0,0,0,0.5); }
  body.theme-light .term{ background:#14161c; color:#d6f5ec; }
  body.theme-light .dicon .lbl{ text-shadow:0 1px 3px rgba(var(--tint-rgb),0.7); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:var(--font-body);
    color:var(--text-primary);
    background:var(--bg-void);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(var(--tint-rgb),0.15);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(var(--tint-rgb),0.25);}

  /* ============ SETUP WIZARD (Windows Setup style) ============ */
  #setup{
    position:fixed;inset:0;z-index:10500;
    background:linear-gradient(160deg, #1c6fc9 0%, #0d4e96 55%, #062a55 100%);
    display:flex;flex-direction:column;
    padding:54px 64px;
    transition:opacity .5s ease;
    color:#fff;
  }
  #setup.hide{opacity:0;pointer-events:none;}
  .setup-winlogo{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;margin-bottom:46px;flex:0 0 auto;}
  .setup-winlogo span{border-radius:1px;}
  .setup-winlogo span:nth-child(1){background:var(--accent);}
  .setup-winlogo span:nth-child(2){background:var(--cool);}
  .setup-winlogo span:nth-child(3){background:#f0708f;}
  .setup-winlogo span:nth-child(4){background:#b9e86b;}
  .setup-card{max-width:480px;flex:1;display:flex;flex-direction:column;}
  .setup-eyebrow{font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,0.65);margin-bottom:10px;font-weight:500;}
  .setup-h{font-family:var(--font-display);font-weight:600;font-size:28px;margin-bottom:10px;color:#fff;letter-spacing:-.01em;}
  .setup-sub{font-size:13.5px;color:rgba(255,255,255,0.72);line-height:1.6;margin-bottom:22px;}
  .setup-field{margin-bottom:14px;max-width:340px;}
  .setup-field label{display:block;font-size:11.5px;color:rgba(255,255,255,0.65);margin-bottom:6px;}
  .setup-select, .setup-input{
    width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);border-radius:5px;
    padding:9px 12px;color:#fff;font-size:13.5px;outline:none;font-family:var(--font-body);
  }
  .setup-select option{color:#111;}
  .setup-input::placeholder{color:rgba(255,255,255,0.5);}
  .setup-license{
    background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:14px;
    font-size:11.5px;line-height:1.7;color:rgba(255,255,255,0.8);max-height:150px;overflow:auto;margin-bottom:14px;font-family:var(--font-mono);max-width:400px;
  }
  .setup-check{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:6px;cursor:pointer;color:#fff;}
  .setup-check input{width:16px;height:16px;accent-color:var(--accent);}
  .setup-actions{position:fixed;right:64px;bottom:48px;display:flex;gap:10px;}
  .setup-btn{padding:9px 26px;border-radius:3px;border:none;font-size:13.5px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:opacity .15s ease, background .15s ease;}
  .setup-btn.primary{background:#fff;color:#0d4e96;}
  .setup-btn.primary:disabled{opacity:.35;cursor:not-allowed;}
  .setup-btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.5);}
  .setup-btn.ghost:hover{background:rgba(255,255,255,0.1);}
  .setup-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.15);max-width:400px;}
  .setup-toggle-row:last-of-type{border-bottom:none;}
  .setup-toggle-row .ttl{font-size:13.5px;color:#fff;}
  .setup-toggle-row .sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;}
  .setup-progress-wrap{text-align:center;padding:14px 0 4px;}
  .setup-center{display:flex;flex-direction:column;align-items:flex-start;text-align:left;justify-content:center;flex:1;}
  .setup-drivelist, .setup-netlist{display:flex;flex-direction:column;gap:8px;max-width:400px;margin-bottom:10px;}
  .setup-drive, .setup-net{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:6px;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;font-size:13px;
  }
  .setup-drive.sel, .setup-net.sel{background:rgba(255,255,255,0.22);border-color:#fff;}
  .setup-inst-option{
    display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:6px;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;margin-bottom:10px;max-width:400px;
  }
  .setup-inst-option.sel{background:rgba(255,255,255,0.22);border-color:#fff;}
  .setup-inst-option.disabled{opacity:.4;cursor:not-allowed;}
  .setup-inst-option .ttl{font-size:13.5px;font-weight:600;}
  .setup-inst-option .sub{font-size:11.5px;color:rgba(255,255,255,0.65);}

  .inst-mark{width:52px;height:52px;margin-bottom:14px;}
  .inst-mark svg{width:100%;height:100%;transform-origin:center;animation:instspin 1.3s linear infinite;}
  .inst-mark circle{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:110 170;}
  @keyframes instspin{to{transform:rotate(360deg);}}
  .inst-steps{display:flex;flex-direction:column;gap:5px;width:100%;max-width:360px;margin:6px 0 16px;}
  .inst-step{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,0.5);padding:4px 0;transition:color .2s ease;}
  .inst-step .inst-ind{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);flex:0 0 auto;position:relative;transition:border-color .2s ease, background .2s ease;}
  .inst-step.active{color:#fff;}
  .inst-step.active .inst-ind{border-color:#fff;}
  .inst-step.active .inst-ind::after{content:'';position:absolute;inset:2px;border-radius:50%;background:#fff;animation:instpulse 1s ease-in-out infinite;}
  @keyframes instpulse{0%,100%{opacity:.3}50%{opacity:1}}
  .inst-step.done{color:rgba(255,255,255,0.85);}
  .inst-step.done .inst-ind{border-color:#fff;background:#fff;}
  .inst-step.done .inst-ind::before{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0d4e96;font-weight:700;}
  .inst-bar{width:100%;max-width:360px;height:4px;background:rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;}
  .inst-bar-fill{height:100%;width:0%;background:#fff;border-radius:4px;}
  .inst-pct{font-size:11px;color:rgba(255,255,255,0.7);width:100%;max-width:360px;text-align:right;font-variant-numeric:tabular-nums;margin-top:6px;}

  /* ============ BOOT ============ */
  #boot{
    position:fixed;inset:0;z-index:9999;
    background:radial-gradient(ellipse at 50% 40%, #1a1d27 0%, #0a0c11 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .7s ease;
  }
  #boot.hide{opacity:0;pointer-events:none;}
  .boot-mark{width:64px;height:64px;margin-bottom:28px;}
  .boot-mark circle{
    fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:170;stroke-dashoffset:170;
    animation:draw 1.6s ease forwards;
  }
  .boot-mark path{
    fill:none;stroke:var(--text-primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:80;stroke-dashoffset:80;
    animation:draw 1.2s ease forwards .5s;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .boot-word{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.35em;color:var(--text-muted);margin-bottom:22px;text-transform:uppercase;}
  .boot-bar{width:180px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
  .boot-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--cool));animation:load 1.8s ease forwards .2s;}
  @keyframes load{to{width:100%;}}

  /* ============ LOCK SCREEN ============ */
  #lock{
    position:fixed;inset:0;z-index:9000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .6s cubic-bezier(.6,0,.3,1), opacity .6s ease;
  }
  #lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .lock-clock{font-family:var(--font-display);font-weight:300;font-size:96px;line-height:1;letter-spacing:-2px;text-shadow:0 4px 40px rgba(0,0,0,.4);}
  .lock-date{font-size:17px;color:var(--text-muted);margin-top:10px;font-weight:500;}
  .lock-name{font-size:15px;color:var(--text-primary);margin-top:16px;font-weight:600;font-family:var(--font-display);}
  .lock-hint{position:absolute;bottom:60px;font-size:13px;color:var(--text-dim);letter-spacing:.05em;animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .lock-pass{display:flex;gap:8px;margin-top:24px;cursor:default;}
  .lock-pass input{
    background:rgba(var(--tint-rgb),0.08);border:1px solid var(--glass-border);border-radius:12px;
    padding:11px 14px;color:var(--text-primary);font-size:14px;outline:none;width:190px;font-family:var(--font-body);
  }
  .lock-pass input::placeholder{color:var(--text-dim);}
  .lock-pass button{
    background:var(--accent);border:none;border-radius:12px;padding:0 18px;color:#1a1006;font-weight:700;cursor:pointer;font-size:13px;
  }
  .lock-error{color:var(--danger);font-size:12px;margin-top:10px;height:14px;text-align:center;}
  .lock-pass.shake{animation:lockshake .4s ease;}
  @keyframes lockshake{
    10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(5px)}
    30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)}
  }

  /* ============ DESKTOP ============ */
  #desktop{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(232,147,91,0.16), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(127,227,214,0.14), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(120,110,220,0.12), transparent 50%),
      linear-gradient(160deg, #10121a 0%, #0a0c11 60%, #0d0f16 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{background-position:0% 0%, 100% 0%, 50% 100%, 0 0;}
    100%{background-position:10% 15%, 85% 20%, 40% 85%, 0 0;}
  }
  #desktop[data-wallpaper="sunset"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(255,140,90,0.24), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,90,140,0.20), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,200,80,0.16), transparent 50%),
      linear-gradient(160deg, #2a1220 0%, #180a12 60%, #1f0f16 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
  }
  #desktop[data-wallpaper="ocean"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(80,180,255,0.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(60,230,210,0.20), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(40,90,200,0.18), transparent 50%),
      linear-gradient(160deg, #0a1a24 0%, #061219 60%, #08161f 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
  }
  #desktop[data-wallpaper="forest"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(120,200,110,0.20), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(200,220,90,0.16), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(40,120,80,0.20), transparent 50%),
      linear-gradient(160deg, #0e1a10 0%, #0a130c 60%, #0c150e 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
  }
  #desktop[data-wallpaper="midnight"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(120,110,220,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(90,90,180,0.15), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(60,60,140,0.14), transparent 50%),
      linear-gradient(160deg, #0a0a14 0%, #060610 60%, #08081a 100%);
    background-size:140% 140%, 140% 140%, 160% 160%, 100% 100%;
  }
  #desktop[data-wallpaper="mono"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.07), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,255,255,0.05), transparent 45%),
      linear-gradient(160deg, #16171a 0%, #0d0e10 60%, #111214 100%);
    background-size:140% 140%, 140% 140%, 100% 100%;
  }
  #desktop[data-wallpaper="custom"]{
    animation:none;background-size:cover;background-position:center;background-repeat:no-repeat;
  }
  .wp-swatch{
    width:64px;height:42px;border-radius:9px;cursor:pointer;flex:0 0 auto;
    border:2px solid transparent;background-size:cover;position:relative;overflow:hidden;
  }
  .wp-swatch.active{border-color:var(--accent);}
  .wp-swatch.upload{
    display:flex;align-items:center;justify-content:center;background:var(--glass);
    border:1px dashed var(--glass-border);color:var(--text-muted);font-size:18px;
  }
  #desktop-icons{
    position:absolute;top:44px;left:18px;display:flex;flex-direction:column;gap:6px;z-index:2;
  }
  .dicon{
    width:82px;padding:10px 4px;border-radius:var(--radius-sm);text-align:center;cursor:default;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .dicon:hover, .dicon.sel{background:rgba(var(--tint-rgb),0.08);}
  .dicon.drop-hover{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;}
  .dicon .icn{color:var(--text-primary);filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));display:flex;align-items:center;justify-content:center;}
  .dicon .lbl{font-size:11.5px;color:var(--text-primary);text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.25;}

  /* ============ MENU BAR ============ */
  #menubar{
    position:fixed;top:0;left:0;right:0;height:32px;z-index:500;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    background:rgba(var(--panel-rgb),0.55);backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-bottom:1px solid rgba(var(--tint-rgb),0.06);
    font-size:12.5px;font-weight:500;
  }
  #menubar .left{display:flex;align-items:center;gap:18px;}
  #menubar .mark{width:15px;height:15px;opacity:.9;}
  #menubar .appname{font-weight:600;font-family:var(--font-display);}
  #menubar .right{display:flex;align-items:center;gap:14px;color:var(--text-muted);}
  #menubar .right span{cursor:default;}
  #menubar .right .clock{color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .mb-bell{position:relative;cursor:pointer !important;display:flex;align-items:center;color:var(--text-muted);}
  .mb-bell:hover{color:var(--text-primary);}
  .mb-bell .badge{
    position:absolute;top:-5px;right:-7px;background:var(--accent);color:#1a1006;font-size:9px;font-weight:700;
    border-radius:8px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .mb-qs-trigger{display:flex;align-items:center;gap:14px;cursor:pointer !important;padding:2px 6px;border-radius:6px;}
  .mb-qs-trigger:hover{background:rgba(var(--tint-rgb),0.08);}

  #quickSettings{
    position:fixed;top:38px;right:14px;width:280px;z-index:6600;padding:14px;
    background:rgba(var(--panel-rgb),0.85);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.4);
    opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .16s ease, transform .16s ease;
  }
  #quickSettings.open{opacity:1;transform:none;pointer-events:auto;}
  .qs-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .qs-tile{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text-muted);cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .qs-tile.on{background:var(--accent);color:#1a1006;border-color:var(--accent);}
  .qs-tile-label{font-size:10px;text-align:center;line-height:1.2;}
  .qs-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--text-muted);}
  .qs-slider-row input[type="range"]{flex:1;accent-color:var(--accent);}
  .qs-battery-row{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--glass-border);color:var(--text-muted);font-size:12px;}
  .qs-battery-row #qsBatteryPct{flex:1;}
  .qs-charge-btn{
    font-size:11px;padding:5px 10px;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);
    color:var(--text-primary);cursor:pointer;
  }
  .qs-charge-btn.on{background:var(--accent);color:#1a1006;border-color:var(--accent);}

  #dimOverlay{
    position:fixed;inset:0;z-index:9700;background:#000;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }

  /* ============ NOTIFICATIONS ============ */
  #notif-panel{
    position:fixed;top:38px;right:14px;width:300px;max-height:70vh;overflow:auto;z-index:6500;
    background:rgba(var(--panel-rgb),0.72);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.4);
    padding:8px;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .16s ease, transform .16s ease;
  }
  #notif-panel.open{opacity:1;transform:none;pointer-events:auto;}
  .notif-panel-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;font-size:12px;color:var(--text-muted);}
  .notif-panel-head button{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;}
  .notif-item{display:flex;gap:10px;padding:10px;border-radius:10px;margin-bottom:4px;background:rgba(var(--tint-rgb),0.03);position:relative;}
  .notif-item .ni-icon{width:30px;height:30px;border-radius:9px;background:var(--glass);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
  .notif-item .ni-body{flex:1;min-width:0;}
  .notif-item .ni-title{font-size:12.5px;font-weight:600;}
  .notif-item .ni-msg{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .notif-item .ni-time{font-size:10px;color:var(--text-dim);margin-top:4px;}
  .notif-item .ni-close{position:absolute;top:6px;right:6px;cursor:pointer;color:var(--text-dim);font-size:11px;padding:2px;}
  .notif-item .ni-close:hover{color:var(--text-primary);}
  .notif-empty{padding:34px 10px;text-align:center;color:var(--text-dim);font-size:12.5px;}

  #toast-banner-wrap{position:fixed;bottom:16px;right:16px;z-index:9600;display:flex;flex-direction:column-reverse;gap:8px;}
  .toast-banner{
    width:290px;display:flex;gap:10px;padding:12px;border-radius:14px;
    background:rgba(var(--panel-rgb),0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);box-shadow:0 20px 50px rgba(0,0,0,.4);
    transform:translateX(130%);opacity:0;transition:transform .32s cubic-bezier(.2,1,.3,1), opacity .32s ease;
  }
  .toast-banner.show{transform:none;opacity:1;}
  .toast-banner .tb-icon{width:32px;height:32px;border-radius:9px;background:var(--glass);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}
  .toast-banner .tb-body{flex:1;min-width:0;}
  .toast-banner .tb-title{font-size:12.5px;font-weight:600;}
  .toast-banner .tb-msg{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.35;}

  /* ============ DOCK ============ */
  #dock-wrap{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;z-index:600;pointer-events:none;}
  #dock{
    pointer-events:auto;
    display:flex;align-items:flex-end;gap:10px;padding:9px 12px;
    background:rgba(var(--panel-rgb),0.5);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(var(--tint-rgb),0.06);
  }
  .dock-item{
    position:relative;width:48px;height:48px;border-radius:13px;color:var(--text-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--glass);border:1px solid rgba(var(--tint-rgb),0.06);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), width .16s ease, height .16s ease, background .16s ease;
    transform-origin:bottom center;
  }
  .dock-item .dico{display:flex;align-items:center;justify-content:center;}
  .dock-item:hover{transform:translateY(-10px) scale(1.18);background:var(--glass-strong);}
  .dock-item .dot{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;}
  .dock-item.running .dot{opacity:1;}
  .dock-sep{width:1px;align-self:stretch;background:rgba(var(--tint-rgb),0.1);margin:4px 2px;}

  /* ============ WINDOWS ============ */
  .win{
    position:absolute;min-width:280px;min-height:180px;
    background:rgba(var(--panel-rgb),0.72);
    backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    box-shadow:0 30px 70px rgba(0,0,0,0.45), inset 0 1px 0 rgba(var(--tint-rgb),0.08);
    display:flex;flex-direction:column;overflow:hidden;
    animation:winopen .28s cubic-bezier(.2,1,.3,1);
  }
  @keyframes winopen{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:none;}}
  .win.closing{animation:winclose .18s ease forwards;}
  @keyframes winclose{to{opacity:0;transform:scale(.94);}}
  .win.max{border-radius:0;}
  .win.anim-resize{transition:left .32s cubic-bezier(.16,1,.3,1), top .32s cubic-bezier(.16,1,.3,1), width .32s cubic-bezier(.16,1,.3,1), height .32s cubic-bezier(.16,1,.3,1);}
  #snap-preview{
    position:fixed;z-index:5000;pointer-events:none;
    background:rgba(232,147,91,0.16);border:2px solid var(--accent);border-radius:16px;
    opacity:0;transition:opacity .12s ease, left .1s ease, top .1s ease, width .1s ease, height .1s ease;
    box-shadow:0 0 0 1px rgba(var(--tint-rgb),0.06) inset;
  }
  #snap-preview.show{opacity:1;}
  .win-title{
    height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:rgba(var(--tint-rgb),0.03);border-bottom:1px solid rgba(var(--tint-rgb),0.06);cursor:grab;
  }
  .win-title:active{cursor:grabbing;}
  .traffic{display:flex;gap:8px;margin-right:6px;}
  .tlight{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;position:relative;}
  .tlight.close{background:#e8615b;} .tlight.min{background:#e8b95b;} .tlight.max{background:#7fd88a;}
  .tlight span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(0,0,0,0.5);opacity:0;}
  .win-title:hover .tlight span{opacity:1;}
  .win-titletext{font-size:12.5px;font-weight:600;color:var(--text-muted);font-family:var(--font-display);letter-spacing:.01em;display:flex;align-items:center;gap:6px;}
  .win-icon{display:flex;align-items:center;color:var(--text-muted);}
  .win-body{flex:1;overflow:auto;position:relative;}
  .resize-handle{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;}

  /* ============ CONTEXT MENU ============ */
  .ctx{
    position:fixed;z-index:8000;min-width:190px;padding:6px;
    background:rgba(var(--panel-rgb),0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    font-size:13px;
  }
  .ctx-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text-primary);}
  .ctx-item:hover{background:var(--accent-soft);}
  .ctx-sep{height:1px;background:rgba(var(--tint-rgb),0.08);margin:5px 4px;}

  /* ============ SHARED APP UI ============ */
  .app-pad{padding:16px;height:100%;overflow:auto;}
  .fe-wrap{display:flex;height:100%;}
  .fe-side{width:150px;flex:0 0 auto;background:rgba(var(--tint-rgb),0.02);border-right:1px solid rgba(var(--tint-rgb),0.06);padding:12px 8px;}
  .fe-side-item{padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-muted);margin-bottom:2px;}
  .fe-side-item.drop-hover{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;}
  .fe-side-item:hover{background:var(--glass);color:var(--text-primary);}
  .fe-side-item.active{background:var(--accent-soft);color:var(--text-primary);}
  .fe-main{flex:1;padding:16px;overflow:auto;}
  .fe-crumb{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-family:var(--font-mono);}
  .fe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;}
  .fe-item{padding:10px 4px;border-radius:10px;text-align:center;cursor:pointer;}
  .fe-item.drop-hover{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;}
  .touch-drag-ghost{
    position:fixed;top:0;left:0;width:44px;height:44px;
    pointer-events:none;z-index:99997;opacity:0.9;
    color:var(--accent);display:flex;align-items:center;justify-content:center;
    background:rgba(var(--panel-rgb),0.65);border:1px solid var(--glass-border);border-radius:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .fe-item:hover{background:var(--glass);}
  .fe-item .fi{color:var(--text-primary);display:flex;align-items:center;justify-content:center;}
  .fe-item .fl{font-size:11.5px;margin-top:6px;word-break:break-word;color:var(--text-primary);}
  .fe-rename-input{
    width:100%;margin-top:6px;background:rgba(var(--tint-rgb),0.08);border:1px solid var(--accent);border-radius:6px;
    color:var(--text-primary);font-size:11.5px;text-align:center;padding:2px 4px;outline:none;font-family:var(--font-body);
  }
  .fe-empty{color:var(--text-dim);font-size:13px;padding:30px;text-align:center;}

  textarea.notes-area{
    width:100%;height:100%;border:none;outline:none;resize:none;
    background:transparent;color:var(--text-primary);font-family:var(--font-mono);font-size:14px;line-height:1.6;padding:18px;
  }
  .notes-tab{padding:8px 14px;font-size:12.5px;color:var(--text-muted);border-bottom:1px solid rgba(var(--tint-rgb),0.06);background:rgba(var(--tint-rgb),0.02);}

  .term{background:#0c0d12;height:100%;padding:12px 14px;font-family:var(--font-mono);font-size:13px;overflow:auto;color:#d6f5ec;}
  .term-line{white-space:pre-wrap;word-break:break-word;margin-bottom:2px;}
  .term-prompt{color:var(--accent);}
  .term-input-row{display:flex;}
  .term-input{flex:1;background:transparent;border:none;outline:none;color:#d6f5ec;font-family:var(--font-mono);font-size:13px;}

  .calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:10px;background:rgba(0,0,0,0.15);}
  .calc-screen{font-family:var(--font-display);font-size:38px;text-align:right;padding:14px 10px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-btn{border:none;border-radius:12px;background:var(--glass);color:var(--text-primary);font-size:17px;font-family:var(--font-display);cursor:pointer;transition:background .12s;}
  .calc-btn:hover{background:var(--glass-strong);}
  .calc-btn.op{background:rgba(232,147,91,0.2);color:var(--accent);}
  .calc-btn.eq{background:var(--accent);color:#1a1006;font-weight:700;}

  /* ============ PERFORMANCE HUB ============ */
  .perf-modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .perf-mode-btn{
    padding:10px 4px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);
    color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-display);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .perf-mode-btn.active{background:var(--accent);color:#1a1006;border-color:var(--accent);}
  .perf-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .perf-stat-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px;transition:box-shadow .3s ease;}
  .perf-stats-grid.boosting .perf-stat-card{box-shadow:0 0 0 1px var(--accent), 0 0 16px var(--accent-soft);}
  .perf-stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
  .perf-stat-value{font-family:var(--font-display);font-size:22px;font-weight:600;margin:4px 0 8px;}
  .perf-stat-bar{height:5px;border-radius:4px;background:rgba(var(--tint-rgb),0.08);overflow:hidden;}
  .perf-stat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--cool));transition:width .5s ease;}
  .perf-fan-row{display:flex;align-items:center;gap:12px;}
  .perf-fan-row input[type="range"]{flex:1;accent-color:var(--accent);}
  .perf-boost-btn{
    width:100%;padding:13px;border-radius:14px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--cool));color:#1a1006;
    font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;
    transition:transform .15s ease;
  }
  .perf-boost-btn:active{transform:scale(0.97);}
  .perf-boost-btn:disabled{opacity:.5;cursor:not-allowed;}
  .perf-light-swatches{display:flex;gap:8px;}

  /* ============ GAMES ============ */
  .game-wrap{position:relative;height:100%;display:flex;flex-direction:column;background:#05060a;}
  .game-hud{
    display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
    font-size:11px;color:var(--text-dim);font-family:var(--font-mono);
    border-bottom:1px solid rgba(255,255,255,0.06);flex:0 0 auto;
  }
  .game-hud span{white-space:nowrap;}
  .game-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    background:rgba(5,6,10,0.82);text-align:center;padding:20px;z-index:5;
  }
  .game-overlay h2{font-family:var(--font-display);font-size:20px;margin:0;color:#fff;}
  .game-overlay p{font-size:12.5px;color:rgba(255,255,255,0.65);max-width:260px;line-height:1.5;margin:0;}
  .game-btn{
    padding:10px 26px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--cool));color:#1a1006;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;
  }
  .rt-grid{flex:1;display:grid;gap:8px;padding:16px;place-content:center;}
  .rt-tile{
    width:100%;height:100%;border-radius:12px;background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:background .1s ease, transform .1s ease;
  }
  .rt-tile.lit{background:var(--accent);box-shadow:0 0 22px var(--accent-soft);}
  .rt-tile.wrong{background:var(--danger);}
  .rt-burst{
    position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);
    pointer-events:none;z-index:8;
  }

  /* ============ PAINT ============ */
  .paint-wrap{display:flex;flex-direction:column;height:100%;}
  .paint-toolbar{
    display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap;
    border-bottom:1px solid var(--glass-border);background:rgba(var(--tint-rgb),0.02);flex:0 0 auto;
  }
  .paint-swatches{display:flex;gap:5px;}
  .paint-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex:0 0 auto;}
  .paint-swatch.active{border-color:var(--text-primary);}
  .paint-tool-btn{
    width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text-primary);cursor:pointer;font-size:14px;
  }
  .paint-tool-btn.active{background:var(--accent);color:#1a1006;border-color:var(--accent);}
  .paint-canvas-wrap{flex:1;overflow:hidden;position:relative;background:#1a1a1a;}
  .paint-canvas-wrap canvas{display:block;touch-action:none;background:#fff;}
  .paint-save-overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.55);z-index:20;
  }
  .paint-save-card{
    background:rgba(var(--panel-rgb),0.95);border:1px solid var(--glass-border);border-radius:14px;
    padding:18px;width:240px;text-align:center;
  }
  .paint-save-card input{
    width:100%;margin:10px 0;background:rgba(var(--tint-rgb),0.06);border:1px solid var(--glass-border);
    border-radius:8px;padding:8px 10px;color:var(--text-primary);font-size:13px;outline:none;text-align:center;
  }

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(var(--tint-rgb),0.06);}
  .settings-label{font-size:13.5px;}
  .settings-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.active{border-color:var(--text-primary);}
  .toggle{width:42px;height:24px;border-radius:14px;background:rgba(var(--tint-rgb),0.15);position:relative;cursor:pointer;flex:0 0 auto;}
  .toggle.on{background:var(--accent);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s ease;}
  .toggle.on .toggle-knob{transform:translateX(18px);}
  .about-mark{width:52px;height:52px;margin-bottom:10px;}
  .specs-grid{display:flex;flex-direction:column;gap:1px;margin-top:4px;}
  .spec-row{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(var(--tint-rgb),0.05);font-size:12px;}
  .spec-row:last-child{border-bottom:none;}
  .spec-row .sk{color:var(--text-dim);flex:0 0 auto;}
  .spec-row .sv{color:var(--text-primary);font-family:var(--font-mono);font-size:11px;text-align:right;word-break:break-word;}

  h3.section-h{font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin:18px 0 4px;}
  h3.section-h:first-child{margin-top:0;}

  /* ============ LAUNCHER ============ */
  #launcher{
    position:fixed;inset:0;z-index:7000;
    background:rgba(var(--panel-rgb),0.45);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);
    display:flex;flex-direction:column;align-items:center;
    padding-top:9vh;
    opacity:0;pointer-events:none;transform:scale(1.04);
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,1,.3,1);
  }
  #launcher.open{opacity:1;pointer-events:auto;transform:scale(1);}
  .launcher-search{
    width:min(420px, 80vw);padding:13px 18px;border-radius:16px;
    background:rgba(var(--tint-rgb),0.07);border:1px solid var(--glass-border);
    color:var(--text-primary);font-size:15px;font-family:var(--font-body);outline:none;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .launcher-search::placeholder{color:var(--text-dim);}
  .launcher-grid{
    margin-top:44px;display:grid;grid-template-columns:repeat(4,104px);gap:22px 14px;
    max-width:90vw;
  }
  .launcher-item{
    display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;
    padding:10px 6px;border-radius:16px;transition:transform .14s ease, background .14s ease;
  }
  .launcher-item:hover, .launcher-item.kbd-sel{background:rgba(var(--tint-rgb),0.07);transform:translateY(-3px);}
  .launcher-item .li-icn{
    width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);
    background:var(--glass);border:1px solid rgba(var(--tint-rgb),0.08);box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .launcher-item .li-lbl{font-size:12px;color:var(--text-primary);text-align:center;}
  .launcher-empty{margin-top:60px;color:var(--text-dim);font-size:13px;}
  .launcher-hint{position:fixed;bottom:26px;font-size:12px;color:var(--text-dim);letter-spacing:.03em;}
  .launcher-power{
    position:fixed;bottom:24px;right:5vw;width:38px;height:38px;border-radius:50%;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease;
  }
  .launcher-power:hover{background:var(--glass-strong);}

  #powerMenu{
    position:fixed;z-index:8000;min-width:170px;padding:6px;bottom:76px;right:5vw;
    background:rgba(var(--panel-rgb),0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    font-size:13px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .14s ease, transform .14s ease;
  }
  #powerMenu.open{opacity:1;transform:none;pointer-events:auto;}

  #powerscreen{
    position:fixed;inset:0;z-index:10800;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    opacity:0;pointer-events:none;transition:opacity .5s ease;
  }
  #powerscreen.show{opacity:1;pointer-events:auto;}
  .power-mark{width:44px;height:44px;}
  .power-mark svg{width:100%;height:100%;animation:instspin 1.3s linear infinite;}
  .power-mark circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:110 170;}
  .power-text{font-family:var(--font-display);font-size:14px;color:rgba(255,255,255,0.7);letter-spacing:.03em;}
  .power-sub{font-size:12px;color:rgba(255,255,255,0.35);cursor:pointer;}
  .power-progress-wrap{width:220px;}
  .power-progress-bar{height:3px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;}
  .power-progress-fill{height:100%;width:0%;background:#fff;border-radius:3px;}
  .power-pct{font-size:11px;color:rgba(255,255,255,0.5);text-align:center;margin-top:8px;font-variant-numeric:tabular-nums;}

  /* ============ CUSTOM CURSOR ============ */
  body.custom-cursor-on, body.custom-cursor-on *{ cursor:none !important; }
  #mcursor{
    position:fixed;top:0;left:0;
    pointer-events:none;z-index:99999;opacity:0;
    transform:translate(-100px,-100px);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45));
    transition:opacity .15s ease;
  }
  #mcursor.show{opacity:1;}
  #mcursor.tap svg{transform:scale(0.82);}
  #mcursor svg{transition:transform .12s ease;display:block;}
  .cursor-ripple{
    position:fixed;top:0;left:0;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--accent);pointer-events:none;z-index:99998;
    transform:translate(-50%,-50%) scale(0.3);opacity:0.85;
  }
  .cursor-ripple.animate{animation:rippleOut .5s ease-out forwards;}
  @keyframes rippleOut{to{transform:translate(-50%,-50%) scale(3.2);opacity:0;}}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:rgba(var(--panel-rgb),0.9);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
    padding:10px 18px;border-radius:12px;font-size:13px;z-index:9500;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============================================================
     FAKE FILESYSTEM
  ============================================================ */
  const FS = {
    root: {
      type:'folder', name:'Home',
      children:{
        'Documents': {type:'folder', name:'Documents', children:{
          'welcome.txt': {type:'file', name:'welcome.txt', content:'Welcome to Aether.\n\nThis is a simulated desktop OS running entirely in your browser — no install, no server, just HTML, CSS and JavaScript.\n\nTry the Terminal, drag windows around, or open Settings to change the accent color.'},
          'todo.txt': {type:'file', name:'todo.txt', content:'- build an OS\n- make it feel real\n- add a terminal\n- ship it'}
        }},
        'Desktop': {type:'folder', name:'Desktop', children:{}},
        'Notes': {type:'folder', name:'Notes', children:{
          'ideas.txt': {type:'file', name:'ideas.txt', content:'Random ideas go here.'}
        }},
      }
    }
  };
  function pathParts(p){return p.split('/').filter(Boolean);}
  function getNode(path){
    let node = FS.root;
    for(const part of pathParts(path)){
      if(!node.children || !node.children[part]) return null;
      node = node.children[part];
    }
    return node;
  }

  /* ============================================================
     ICON SYSTEM — hand-drawn line icons, no external dependency
  ============================================================ */
  const ICONS = {
    files: '<path d="M3 7.5a2 2 0 0 1 2-2h4.2l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    file: '<path d="M6 2.5h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2z"/><path d="M14 2.5v5h5"/><line x1="8" y1="13.5" x2="16" y2="13.5"/><line x1="8" y1="17" x2="13" y2="17"/>',
    notes: '<path d="M6 2.5h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2z"/><path d="M14 2.5v5h5"/><path d="M8.5 13.2l5.3-5.3 2.1 2.1-5.3 5.3H8.5z"/>',
    terminal: '<rect x="2.2" y="4.5" width="19.6" height="15" rx="2"/><path d="M6.5 9.5l3.5 3-3.5 3"/><line x1="12.5" y1="15.5" x2="17.5" y2="15.5"/>',
    browser: '<circle cx="12" cy="12" r="9.5"/><polygon points="15.5,8.5 13.3,13.3 8.5,15.5 10.7,10.7"/>',
    music: '<path d="M9 18.5V5.2l11-2v13"/><circle cx="6" cy="18.5" r="3"/><circle cx="17" cy="16.2" r="3"/>',
    photos: '<rect x="2.5" y="3.5" width="19" height="17" rx="2"/><circle cx="8.2" cy="9" r="1.6"/><path d="M21 15.5l-5.5-5.5-9 9"/>',
    calculator: '<rect x="4.5" y="2" width="15" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><circle cx="8" cy="11" r="0.9"/><circle cx="12" cy="11" r="0.9"/><circle cx="16" cy="11" r="0.9"/><circle cx="8" cy="15" r="0.9"/><circle cx="12" cy="15" r="0.9"/><circle cx="16" cy="15" r="0.9"/><circle cx="8" cy="19" r="0.9"/><circle cx="12" cy="19" r="0.9"/><circle cx="16" cy="19" r="0.9"/>',
    settings: '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.65 1.65 0 0 0-1.8-.3 1.65 1.65 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.65 1.65 0 0 0 .3-1.8 1.65 1.65 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.65 1.65 0 0 0 1.8.3H9a1.65 1.65 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.65 1.65 0 0 0-.3 1.8V9a1.65 1.65 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.65 1.65 0 0 0-1.5 1z"/>',
    trash: '<path d="M3.5 6.5h17"/><path d="M8.5 6.5v-2a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v2"/><path d="M18.5 6.5l-1 13a2 2 0 0 1-2 2H8.5a2 2 0 0 1-2-2l-1-13"/><line x1="10" y1="10.5" x2="10" y2="17"/><line x1="14" y1="10.5" x2="14" y2="17"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
    plus: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
    info: '<circle cx="12" cy="12" r="9.5"/><line x1="12" y1="16" x2="12" y2="11.5"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    bell: '<path d="M18 8.5a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5"/><path d="M13.7 20.5a2 2 0 0 1-3.4 0"/>',
    wifi: '<path d="M2 8.5a15.5 15.5 0 0 1 20 0"/><path d="M5.5 12.3a10.5 10.5 0 0 1 13 0"/><path d="M9 16.2a5.5 5.5 0 0 1 6 0"/><line x1="12" y1="19.5" x2="12.01" y2="19.5"/>',
    refresh: '<path d="M3 12a9 9 0 1 1 2.6 6.3"/><path d="M3 21v-6h6"/>',
    taskmanager: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
    performance: '<path d="M12 12L16.5 7.5"/><path d="M4 15a8 8 0 1 1 16 0"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
    novadash: '<path d="M12 3 L19 19 L12 15 L5 19 Z"/>',
    bluetooth: '<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
    airplane: '<path d="M12 2l3 7 7 3-7 1-3 9-3-9-7-1 7-3z"/>',
    sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>',
    volume: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
    volumeMute: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="16" y1="9" x2="21" y2="14"/><line x1="21" y1="9" x2="16" y2="14"/>',
    battery: '<rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="10.5" x2="22" y2="13.5"/><rect x="4.5" y="9.2" width="11" height="5.6" fill="currentColor" stroke="none"/>',
    batteryCharging: '<rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="10.5" x2="22" y2="13.5"/><path d="M12.5 8.5L9 12.5h3l-1 3.5 4-4.5h-3z" fill="currentColor" stroke="none"/>',
    reflextap: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
    power: '<path d="M12 3v8"/><path d="M6.5 6a8 8 0 1 0 11 0"/>',
    sleep: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
    paint: '<path d="M12 19a7 7 0 0 0 7-7c0-3-2-4-2-6a2 2 0 0 0-4 0c0-1.5-1-2-2-2a2 2 0 0 0-2 2c0 2-2 3-2 6a7 7 0 0 0 5 7z"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/>',
  };
  function iconSvg(name, size, strokeWidth){
    size = size || 22; strokeWidth = strokeWidth || 1.7;
    const p = ICONS[name] || ICONS.file;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  /* ============================================================
     PERSISTENT STORAGE — uses Claude's window.storage when present,
     falls back to localStorage for real-world deployments (e.g. GitHub Pages)
  ============================================================ */
  const Store = {
    async get(key){
      try{
        if(window.storage){
          const r = await window.storage.get(key, false);
          return r ? r.value : null;
        }
        return localStorage.getItem(key);
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        if(window.storage){ await window.storage.set(key, value, false); }
        else{ localStorage.setItem(key, value); }
      }catch(e){ /* storage unavailable — app still works, just won't persist */ }
    }
  };
  let appState = { name:'', password:'', passwordEnabled:false, accent:'#e8935b', motion:false, setupDone:false, customCursor:true, theme:'dark', wallpaper:'aurora', buildVersion:'1.0', wifiOn:true, brightness:100, volume:70 };
  const LATEST_BUILD = '1.1';
  let saveStateTimer = null, saveFsTimer = null;
  function persistState(){
    clearTimeout(saveStateTimer);
    saveStateTimer = setTimeout(()=>{ Store.set('aether_state', JSON.stringify(appState)); }, 400);
  }
  function persistFS(){
    clearTimeout(saveFsTimer);
    saveFsTimer = setTimeout(()=>{ Store.set('aether_fs', JSON.stringify(FS.root)); }, 500);
  }
  async function loadPersisted(){
    try{
      const raw = await Store.get('aether_state');
      if(raw) appState = Object.assign(appState, JSON.parse(raw));
      const rawFs = await Store.get('aether_fs');
      if(rawFs) FS.root = JSON.parse(rawFs);
    }catch(e){ /* corrupt or missing — start fresh */ }
  }

  /* ============================================================
     UTIL
  ============================================================ */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  /* ============================================================
     NOTIFICATION CENTER
  ============================================================ */
  let notifications = [];
  let unreadCount = 0;
  const notifPanel = document.getElementById('notif-panel');
  const notifList = document.getElementById('notifList');
  const notifBadge = document.getElementById('notifBadge');
  const bannerWrap = document.getElementById('toast-banner-wrap');

  function timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s < 60) return 'Just now';
    if(s < 3600) return Math.floor(s/60)+'m ago';
    if(s < 86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  function renderNotifPanel(){
    if(!notifications.length){ notifList.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }
    notifList.innerHTML = notifications.slice().reverse().map(n=>`
      <div class="notif-item" data-id="${n.id}">
        <div class="ni-icon">${iconSvg(n.appId,16,1.8)}</div>
        <div class="ni-body">
          <div class="ni-title">${n.title}</div>
          <div class="ni-msg">${n.message}</div>
          <div class="ni-time">${timeAgo(n.time)}</div>
        </div>
        <div class="ni-close" data-close="${n.id}">✕</div>
      </div>`).join('');
    notifList.querySelectorAll('[data-close]').forEach(b=>{
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        notifications = notifications.filter(n=>String(n.id) !== b.dataset.close);
        renderNotifPanel();
      });
    });
  }
  function showBanner(n){
    const el = document.createElement('div');
    el.className = 'toast-banner';
    el.innerHTML = `<div class="tb-icon">${iconSvg(n.appId,16,1.8)}</div><div class="tb-body"><div class="tb-title">${n.title}</div><div class="tb-msg">${n.message}</div></div>`;
    bannerWrap.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=>el.remove(), 320);
    }, 5000);
  }
  function notify(appId, title, message){
    const n = {id: Date.now()+Math.random(), appId, title, message, time: Date.now()};
    notifications.push(n);
    if(notifications.length > 30) notifications.shift();
    unreadCount++;
    notifBadge.textContent = unreadCount > 9 ? '9+' : unreadCount;
    notifBadge.style.display = 'flex';
    showBanner(n);
    if(notifPanel.classList.contains('open')) renderNotifPanel();
  }
  document.getElementById('mbBell').addEventListener('click', (e)=>{
    e.stopPropagation();
    notifPanel.classList.toggle('open');
    if(notifPanel.classList.contains('open')){
      unreadCount = 0;
      notifBadge.style.display = 'none';
      renderNotifPanel();
    }
  });
  document.getElementById('notifClearAll').addEventListener('click', (e)=>{
    e.stopPropagation();
    notifications = [];
    renderNotifPanel();
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#notif-panel') && !e.target.closest('#mbBell')) notifPanel.classList.remove('open');
  });

  /* ============================================================
     QUICK SETTINGS — Wi-Fi / Bluetooth / Airplane, brightness,
     volume, and a simulated battery
  ============================================================ */
  let bluetoothOn = true;
  let airplaneMode = false;
  let batteryLevel = 87 + Math.floor(Math.random()*10);
  let charging = false;
  let masterVolume = appState.volume;

  const qsPanel = document.getElementById('quickSettings');
  const qsWifiTile = document.getElementById('qsWifi');
  const qsBtTile = document.getElementById('qsBluetooth');
  const qsAirTile = document.getElementById('qsAirplane');
  const qsBrightness = document.getElementById('qsBrightness');
  const qsVolume = document.getElementById('qsVolume');
  const qsChargeBtn = document.getElementById('qsChargeBtn');
  const dimOverlay = document.getElementById('dimOverlay');

  function renderQuickSettings(){
    qsWifiTile.classList.toggle('on', appState.wifiOn && !airplaneMode);
    qsBtTile.classList.toggle('on', bluetoothOn && !airplaneMode);
    qsAirTile.classList.toggle('on', airplaneMode);
    document.getElementById('qsWifi').querySelector('.qs-tile-icon').innerHTML = iconSvg('wifi', 18, 1.8);
    document.getElementById('qsBluetooth').querySelector('.qs-tile-icon').innerHTML = iconSvg('bluetooth', 18, 1.8);
    document.getElementById('qsAirplane').querySelector('.qs-tile-icon').innerHTML = iconSvg('airplane', 18, 1.8);
    document.getElementById('qsBrightnessIcon').innerHTML = iconSvg('sun', 16, 1.7);
    document.getElementById('qsVolumeIcon').innerHTML = iconSvg(masterVolume > 0 ? 'volume' : 'volumeMute', 16, 1.7);
    document.getElementById('qsBatteryIcon').innerHTML = iconSvg(charging ? 'batteryCharging' : 'battery', 17, 1.7);
    document.getElementById('qsBatteryPct').textContent = Math.round(batteryLevel)+'%'+(charging?' · Charging':'');
    qsChargeBtn.classList.toggle('on', charging);
    qsChargeBtn.textContent = charging ? 'Unplug' : 'Plug in';
    updateMenubarStatus();
  }
  function updateMenubarStatus(){
    document.getElementById('mb-batt').textContent = Math.round(batteryLevel)+'%';
    const wifiLabel = document.getElementById('mb-wifi');
    if(airplaneMode) wifiLabel.textContent = '✈ Airplane mode';
    else if(!appState.wifiOn) wifiLabel.textContent = '○ No network';
    else wifiLabel.textContent = '◉ Aether-5G';
  }
  function isOnline(){ return appState.wifiOn && !airplaneMode; }

  qsWifiTile.addEventListener('click', ()=>{
    if(airplaneMode) return;

  function runInstallProgress(){
    const steps = [{dur:1100},{dur:1000},{dur:950},{dur:900},{dur:750}];
    const totalDur = steps.reduce((a,s)=>a+s.dur,0);
    const stepEls = document.querySelectorAll('#instSteps .inst-step');
    const fill = document.getElementById('instBarFill');
    const pct = document.getElementById('instPct');
    const titleEl = document.getElementById('instTitle');
    const start = performance.now();
    function frame(now){
      const t = now - start;
      const p = Math.min(100, (t/totalDur)*100);
      if(fill) fill.style.width = p+'%';
      if(pct) pct.textContent = Math.floor(p)+'%';
      if(t < totalDur) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if(stepEls[0]) stepEls[0].classList.add('active');
    let cum = 0;
    steps.forEach((s,i)=>{
      cum += s.dur;
      setTimeout(()=>{
        if(stepEls[i]){ stepEls[i].classList.remove('active'); stepEls[i].classList.add('done'); }
        if(stepEls[i+1]) stepEls[i+1].classList.add('active');
      }, cum);
    });
    setTimeout(()=>{
      if(titleEl) titleEl.textContent = 'Restarting…';
      setTimeout(()=>{ setupStep++; renderSetup(); }, 700);
    }, totalDur);
  }

  function renderSetup(){
    setupCard.innerHTML = setupScreens[setupStep]();

    const btnNext = document.getElementById('btnNext');
    const btnBack = document.getElementById('btnBack');
    const btnSkip = document.getElementById('btnSkip');

    if(setupStep === 2){
      const chk = document.getElementById('chkAccept');
      chk.addEventListener('change', ()=>{ btnNext.disabled = !chk.checked; });
      btnNext.addEventListener('click', setupNext);
    } else if(setupStep === 3){

      btnNext.addEventListener('click', setupNext);
    } else if(setupStep === 4){
      const drives = document.querySelectorAll('.setup-drive');
      drives.forEach(d=>d.addEventListener('click', ()=>{
        drives.forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');

      btnNext.addEventListener('click', setupNext);

        if(passInput.value !== confirmInput.value){ mismatch.style.display='block'; return; }
        setupData.password = passInput.value;

      });
    } else if(setupStep === 9){
      const togLoc = document.getElementById('togLocation');
      const togTailored = document.getElementById('togTailored');
      const togAdId = document.getElementById('togAdId');
      const togDiag = document.getElementById('togDiag');
      togLoc.addEventListener('click', ()=>{ setupData.location=!setupData.location; togLoc.classList.toggle('on', setupData.location); });
      togTailored.addEventListener('click', ()=>{ setupData.tailored=!setupData.tailored; togTailored.classList.toggle('on', setupData.tailored); });
      togAdId.addEventListener('click', ()=>{ setupData.adId=!setupData.adId; togAdId.classList.toggle('on', setupData.adId); });
      togDiag.addEventListener('click', ()=>{ setupData.diagnostics=!setupData.diagnostics; togDiag.classList.toggle('on', setupData.diagnostics); });
      btnNext.addEventListener('click', setupNext);
    } else if(setupStep === 10){
      setTimeout(finishSetup, 1800);
    } else {
      if(btnNext) btnNext.addEventListener('click', setupNext);
      if(btnSkip) btnSkip.addEventListener('click', setupNext);
    }
  }

  async function initAether(){
    await loadPersisted();
    if(appState.accent) applyAccent(appState.accent);
    document.body.classList.toggle('theme-light', appState.theme === 'light');
    if(appState.password){ osPassword = appState.password; passwordEnabled = !!appState.passwordEnabled; }

      setupEl.style.display = 'none';
      enterBootPhase();

      renderSetup();

  async function applyWallpaperFromState(){

  function brandMark(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="5"/><path d="M20 34 L28 42 L45 22" fill="none" stroke="#f1ede7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  window.addEventListener('load', initAether);

  updateClock(); setInterval(updateClock, 15000);

  /* ============================================================
     CUSTOM CURSOR — visible pointer for touch AND real mouse,
     with contextual shapes and click ripples
  ============================================================ */
  const mcursor = document.getElementById('mcursor');
  let cursorHideTimer = null;
  let cursorState = null;

  const CURSOR_SHAPES = {
    arrow: `<svg width="22" height="26" viewBox="0 0 22 26" fill="none"><path d="M1.2 1 L1.2 19.6 L5.9 15.7 L9.1 22.6 L12.3 21.1 L9 14.2 L15.6 13.9 Z" fill="#0c0d10" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
    pointer: `<svg width="24" height="28" viewBox="0 0 22 26" fill="none"><path d="M1.2 1 L1.2 19.6 L5.9 15.7 L9.1 22.6 L12.3 21.1 L9 14.2 L15.6 13.9 Z" fill="var(--accent)" stroke="#0c0d10" stroke-width="1.1" stroke-linejoin="round"/></svg>`,
    text: `<svg width="5" height="22" viewBox="0 0 5 22" fill="none"><line x1="2.5" y1="1" x2="2.5" y2="21" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/></svg>`,
    resize: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 12 L2 18 L8 18" stroke="#0c0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L18 2 L12 2" stroke="#0c0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="17" x2="17" y2="3" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>`,
  };
  const CURSOR_HOTSPOT = { arrow:[1,1], pointer:[2,1], text:[2,10], resize:[10,10] };

  function setCursorState(state){
    if(state === cursorState) return;
    cursorState = state;
    mcursor.innerHTML = CURSOR_SHAPES[state] || CURSOR_SHAPES.arrow;
  }
  function moveCursor(x,y){
    const hs = CURSOR_HOTSPOT[cursorState] || CURSOR_HOTSPOT.arrow;
    mcursor.style.transform = `translate(${x-hs[0]}px, ${y-hs[1]}px)`;
    mcursor.classList.add('show');
  }
  function cursorEnabled(){ return appState.customCursor !== false; }
  function spawnRipple(x,y){
    const r = document.createElement('div');
    r.className = 'cursor-ripple';
    r.style.left = x+'px'; r.style.top = y+'px';
    document.body.appendChild(r);
    requestAnimationFrame(()=>r.classList.add('animate'));
    setTimeout(()=>r.remove(), 550);
  }
  const POINTER_SELECTOR = 'button, .dock-item, .dicon, .ctx-item, .launcher-item, .calc-btn, .toggle, .swatch, .fe-item, .fe-side-item, .tlight, a, .setup-btn, .setup-inst-option, .setup-drive, .setup-net, .notif-item, .mb-bell, .win-title, [data-app], [data-u], [data-a]';

  document.addEventListener('mousemove', (e)=>{
    if(!cursorEnabled()) return;
    clearTimeout(cursorHideTimer);
    const t = e.target;
    if(t.closest('input, textarea, [contenteditable="true"]')) setCursorState('text');
    else if(t.closest('.resize-handle')) setCursorState('resize');
    else if(t.closest(POINTER_SELECTOR)) setCursorState('pointer');
    else setCursorState('arrow');
    moveCursor(e.clientX, e.clientY);
  });
  document.addEventListener('mousedown', (e)=>{
    if(!cursorEnabled()) return;
    mcursor.classList.add('tap');
    spawnRipple(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', ()=>{ mcursor.classList.remove('tap'); });
  document.addEventListener('mouseleave', ()=>{ mcursor.classList.remove('show'); });

  document.addEventListener('touchstart', (e)=>{
    if(!cursorEnabled()) return;
    const t = e.touches[0]; if(!t) return;
    setCursorState('pointer');
    moveCursor(t.clientX, t.clientY);
    mcursor.classList.add('tap');
    spawnRipple(t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    if(!cursorEnabled()) return;

  ============================================================ */
  function playBootChime(){
    try{
      if(typeof masterVolume !== 'undefined' && masterVolume <= 0) return;
      const volScale = (typeof masterVolume !== 'undefined' ? masterVolume : 70) / 100;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      function tone(freq, start, dur, gain){
        gain = (gain || 0.05) * volScale;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
        g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.05);
      }
      // original ascending chime — not a reproduction of any real OS jingle
      tone(392.00, 0.00, 0.9, 0.05);
      tone(523.25, 0.16, 1.0, 0.05);
      tone(659.25, 0.32, 1.2, 0.045);
      tone(880.00, 0.50, 1.6, 0.04);
      if(ctx.state === 'suspended'){
        const resume = ()=>{ ctx.resume(); };
        document.addEventListener('click', resume, {once:true});
        document.addEventListener('touchstart', resume, {once:true});
      }
    }catch(e){ /* audio unavailable — fail silently */ }
  }
  function enterBootPhase(){
    playBootChime();
    setTimeout(()=>{
      document.getElementById('boot').classList.add('hide');
    }, 1900);
  }

  const desktop = document.getElementById('desktop');

  function setActiveAppName(name){ document.getElementById('activeAppName').textContent = name; }

  function bringToFront(win){
    zTop++; win.style.zIndex = zTop;

  /* ---- window snapping ---- */
  const snapPreviewEl = document.getElementById('snap-preview');
  const SNAP_EDGE = 26;
  function getSnapZone(x, y){
    if(y <= 32 + SNAP_EDGE) return 'full';
    if(x <= SNAP_EDGE) return 'left';
    if(x >= window.innerWidth - SNAP_EDGE) return 'right';
    return null;
  }
  function snapRect(zone){
    const top = 32;
    if(zone==='left') return {left:0, top, width:window.innerWidth/2, height:window.innerHeight-top};
    if(zone==='right') return {left:window.innerWidth/2, top, width:window.innerWidth/2, height:window.innerHeight-top};
    return {left:0, top, width:window.innerWidth, height:window.innerHeight-top};
  }
  function showSnapPreview(zone){
    if(!zone){ snapPreviewEl.classList.remove('show'); return; }
    const r = snapRect(zone);
    snapPreviewEl.style.left = r.left+'px'; snapPreviewEl.style.top = r.top+'px';
    snapPreviewEl.style.width = r.width+'px'; snapPreviewEl.style.height = r.height+'px';
    snapPreviewEl.classList.add('show');
  }
  function hideSnapPreview(){ snapPreviewEl.classList.remove('show'); }
  function applySnap(win, zone){
    const r = snapRect(zone);
    win.classList.add('anim-resize');
    win.style.left = r.left+'px'; win.style.top = r.top+'px';
    win.style.width = r.width+'px'; win.style.height = r.height+'px';
    if(zone==='full'){ win.classList.add('max'); win.dataset.max='1'; }
    else { win.classList.remove('max'); win.dataset.max=''; }
    setTimeout(()=>win.classList.remove('anim-resize'), 340);
  }

  function createWindow({appId, title, icon, width, height, content, onMount}){
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.app = appId;
    win.dataset.appTitle = title;
    cascade = (cascade + 1) % 6;
    const left = 90 + cascade*32 + Math.random()*10;
    const top = 60 + cascade*26;
    win.style.left = left+'px';
    win.style.top = top+'px';
    win.style.width = (width||520)+'px';
    win.style.height = (height||380)+'px';

    win.innerHTML = `
      <div class="win-title">
        <div class="traffic">
          <button class="tlight close" data-act="close"><span>✕</span></button>
          <button class="tlight min" data-act="min"><span>–</span></button>
          <button class="tlight max" data-act="max"><span>▢</span></button>
        </div>
        <div class="win-titletext"><span class="win-icon">${iconSvg(appId, 14, 1.8)}</span>${title}</div>
      </div>
      <div class="win-body"></div>
      <div class="resize-handle"></div>
    `;
    const body = win.querySelector('.win-body');
    if(typeof content === 'string') body.innerHTML = content;
    else if(content instanceof Node) body.appendChild(content);

    desktop.appendChild(win);
    bringToFront(win);
    (openWindows[appId] = openWindows[appId]||[]).push(win);
    setDockRunning(appId, true);

    // dragging
    const titleBar = win.querySelector('.win-title');
    let dragging=false, dx=0, dy=0, activeSnap=null;
    titleBar.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.tlight')) return;
      dragging = true; bringToFront(win);
      dx = e.clientX - win.offsetLeft; dy = e.clientY - win.offsetTop;
      e.preventDefault();
    });
    window.addEventListener('mousemove',(e)=>{
      if(!dragging) return;
      win.style.left = Math.max(0, e.clientX-dx)+'px';
      win.style.top = Math.max(32, e.clientY-dy)+'px';
      activeSnap = getSnapZone(e.clientX, e.clientY);
      showSnapPreview(activeSnap);
    });
    window.addEventListener('mouseup',()=>{
      if(dragging && activeSnap) applySnap(win, activeSnap);
      dragging=false;
      hideSnapPreview();
      activeSnap = null;
    });
    win.addEventListener('mousedown', ()=>bringToFront(win));

    // resize
    const handle = win.querySelector('.resize-handle');
    let resizing=false, rw=0, rh=0, rx=0, ry=0;
    handle.addEventListener('mousedown',(e)=>{
      resizing=true; rw=win.offsetWidth; rh=win.offsetHeight; rx=e.clientX; ry=e.clientY;
      e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('mousemove',(e)=>{
      if(!resizing) return;
      win.style.width = Math.max(280, rw + (e.clientX-rx))+'px';
      win.style.height = Math.max(180, rh + (e.clientY-ry))+'px';
    });
    window.addEventListener('mouseup',()=>resizing=false);

    // traffic lights
    win.querySelector('[data-act="close"]').addEventListener('click', ()=>closeWindow(win));
    win.querySelector('[data-act="min"]').addEventListener('click', ()=>minimizeWindow(win));
    win.querySelector('[data-act="max"]').addEventListener('click', ()=>toggleMax(win));
    win.querySelector('.win-title').addEventListener('dblclick', (e)=>{ if(!e.target.closest('.tlight')) toggleMax(win); });

    if(onMount) onMount(body, win);
    return win;
  }

  function closeWindow(win){
    if(typeof win._cleanup === 'function'){ try{ win._cleanup(); }catch(e){} }
    win.classList.add('closing');
    setTimeout(()=>{
      win.remove();
      const appId = win.dataset.app;
      openWindows[appId] = (openWindows[appId]||[]).filter(w=>w!==win);
      if(!openWindows[appId] || !openWindows[appId].length) setDockRunning(appId, false);
    }, 170);
  }
  function dockTargetFor(win){
    const dockIcon = document.querySelector(`.dock-item[data-app="${win.dataset.app}"]`);
    const wRect = win.getBoundingClientRect();
    if(!dockIcon) return {tx:0, ty:window.innerHeight, sx:0.06, sy:0.04};
    const dRect = dockIcon.getBoundingClientRect();
    const tx = (dRect.left + dRect.width/2) - (wRect.left + wRect.width/2);
    const ty = (dRect.top + dRect.height/2) - (wRect.top + wRect.height/2);
    return {tx, ty, sx: Math.max(0.04, dRect.width / wRect.width), sy: Math.max(0.03, dRect.height / wRect.height)};
  }
  function minimizeWindow(win){
    const {tx, ty, sx, sy} = dockTargetFor(win);
    win.style.transformOrigin = 'center center';
    win.style.transition = 'transform .42s cubic-bezier(.55,0,.85,.35), opacity .38s ease .05s';
    win.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    win.style.opacity = '0.15';
    win.dataset.minimized = '1';
    setTimeout(()=>{ win.style.display='none'; }, 420);
  }
  function restoreWindow(win){
    win.style.display='flex';
    win.style.transition = 'none';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        win.style.transition = 'transform .38s cubic-bezier(.16,1,.3,1), opacity .3s ease';
        win.style.transform='none'; win.style.opacity='1';
        win.dataset.minimized='';
        bringToFront(win);
      });
    });
  }
  function toggleMax(win){
    win.classList.add('anim-resize');
    if(win.dataset.max === '1'){
      win.style.left = win.dataset.pl; win.style.top = win.dataset.pt;
      win.style.width = win.dataset.pw; win.style.height = win.dataset.ph;
      win.classList.remove('max'); win.dataset.max='';
    } else {
      win.dataset.pl = win.style.left; win.dataset.pt = win.style.top;
      win.dataset.pw = win.style.width; win.dataset.ph = win.style.height;
      win.style.left='0px'; win.style.top='32px'; win.style.width='100vw'; win.style.height='calc(100vh - 32px)';
      win.classList.add('max'); win.dataset.max='1';
    }
    setTimeout(()=>win.classList.remove('anim-resize'), 340);
  }

  /* ============================================================

  function launchApp(appId){
    const wins = openWindows[appId] || [];
    if(!wins.length){ APPS[appId] && APPS[appId](); return; }
    const minimized = wins.filter(w=>w.dataset.minimized==='1');
    const visible = wins.filter(w=>w.dataset.minimized!=='1');
    if(visible.length){
      const top = visible.reduce((a,b)=> (parseInt(b.style.zIndex||0,10) > parseInt(a.style.zIndex||0,10) ? b : a));
      if(top.classList.contains('focused')) minimizeWindow(top);
      else bringToFront(top);
      return;
    }
    if(minimized.length){ restoreWindow(minimized[minimized.length-1]); return; }
  }
